<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="apple-mobile-web-app-capable" content="yes"><title>감사 미팅자료</title><style>
:root{--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc;--card:#fff;--blue:#1d4ed8;--red:#b91c1c;--amber:#b45309}
*{box-sizing:border-box}html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;color:var(--ink);background:var(--bg);font-size:17px;line-height:1.6}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
.hero{background:#0f172a;color:#fff;padding:36px 0 28px}
.eyebrow{font-size:13px;letter-spacing:.04em;color:#93c5fd;font-weight:600}
.hero h1{margin:6px 0 8px;font-size:32px;line-height:1.25}
.sub{margin:0;color:#cbd5e1;font-size:15px}.meta{margin-top:10px;font-size:13px;color:#94a3b8}
.tabs{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;-webkit-overflow-scrolling:touch}
.tabs a{flex:0 0 auto;padding:9px 16px;border-radius:999px;background:#eef2ff;color:var(--blue);text-decoration:none;font-weight:600;font-size:15px}
.tabs a.on{background:var(--blue);color:#fff}
section{padding:30px 0 8px;scroll-margin-top:64px}
h2{font-size:24px;margin:0 0 14px;display:flex;align-items:center;gap:10px}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--blue);color:#fff;font-size:16px}
h3{font-size:19px;margin:26px 0 10px}h4{margin:18px 0 6px;font-size:17px;color:var(--blue)}
.note{color:var(--mut);font-size:14px;margin:0 0 14px}
.callout{background:#eff6ff;border-left:5px solid var(--blue);padding:16px 18px;border-radius:10px;margin:14px 0}
.callout.red{background:#fef2f2;border-color:var(--red)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{font-size:13px;color:var(--mut)}.kpi .v{font-size:24px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}.kpi .d{font-size:13px;color:var(--mut)}
.neg{color:var(--red)}.up{color:#047857}.muted{color:var(--mut);font-weight:400}
ol.top li{margin-bottom:10px}
.tblwrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:12px 0;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;vertical-align:top}
th{background:#f1f5f9;font-size:14px;color:#334155}
th:first-child,td:first-child{text-align:left}
tr.sep td{border-top:2px solid #cbd5e1}
table.issues td,table.issues th{text-align:left;white-space:normal}
table.issues td:nth-child(3){white-space:nowrap}
tr.warn td{background:#fffbeb}tr.chk td{background:#f8fafc}
.tag{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:700;margin-right:4px}
.tag.hi{background:#fee2e2;color:var(--red)}.tag.mid{background:#fef3c7;color:var(--amber)}.tag.lo{background:#e0f2fe;color:#0369a1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card,.chartcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
.ct{font-weight:700;margin-bottom:8px}
table.mini td{padding:7px 4px;white-space:normal}table.mini td.r{text-align:right;white-space:nowrap}
table.mini tr.tot td{border-top:2px solid var(--ink);font-weight:700;border-bottom:0}
.chart{width:100%;height:auto;color:var(--ink)}
.risk{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rc{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--red);border-radius:12px;padding:14px 16px}
.rc.mid{border-top-color:#f59e0b}.rt{font-weight:700;font-size:17px;margin-bottom:4px}.rc p{margin:6px 0;font-size:15px}
.rc .do{color:#1e3a8a;background:#eff6ff;padding:8px 10px;border-radius:8px}
.pbcsum{display:flex;gap:12px;margin:8px 0}
.pbcsum div{flex:1;background:#ecfdf5;border-radius:12px;padding:12px;text-align:center}
.pbcsum div.amber{background:#fffbeb}.pbcsum div.gray{background:#f1f5f9}
.pbcsum b{display:block;font-size:28px}.pbcsum span{font-size:13px;color:var(--mut)}
.q{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 20px 14px}
.q li{margin:6px 0}
ul.tight{padding-left:20px;margin:4px 0}ul.tight li{font-size:15px;margin:4px 0}
tr.tot td{border-top:2px solid var(--ink)}
table.proj td:nth-child(2){text-align:left}
.src{margin:34px 0 50px;padding:16px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)}
@media (max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}.two,.risk{grid-template-columns:1fr}.hero h1{font-size:26px}}
@media print{.tabs,#lock{display:none}}
</style></head><body>
<div id="lock">
  <form id="f" autocomplete="off">
    <div class="lt">🔒 감사 미팅자료</div>
    <div class="ls">비밀번호를 입력하세요</div>
    <input id="pw" type="password" inputmode="numeric" pattern="[0-9]*" autofocus placeholder="••••">
    <button type="submit">열기</button>
    <div id="err"></div>
  </form>
</div>
<div id="app"></div>
<style>
#lock{position:fixed;inset:0;display:grid;place-items:center;background:#0f172a;z-index:99;font-family:-apple-system,"Apple SD Gothic Neo",sans-serif}
#lock form{background:#fff;border-radius:18px;padding:30px 28px;width:min(360px,88vw);text-align:center}
.lt{font-weight:700;font-size:20px}.ls{color:#64748b;font-size:14px;margin:6px 0 16px}
#pw{width:100%;font-size:26px;letter-spacing:.4em;text-align:center;padding:12px;border:1px solid #cbd5e1;border-radius:12px}
#lock button{margin-top:14px;width:100%;padding:13px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#1d4ed8;color:#fff}
#err{color:#b91c1c;font-size:14px;min-height:20px;margin-top:10px}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(P.s),iterations:P.i,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(P.v)},key,b(P.c));
  return new TextDecoder().decode(pt);
}
function show(html){
  document.getElementById('app').innerHTML=html;
  document.getElementById('lock').remove();
  const links=[...document.querySelectorAll('.tabs a')];
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){links.forEach(l=>l.classList.toggle('on',l.getAttribute('href')==='#'+e.target.id))}})},{rootMargin:'-40% 0px -55% 0px'});
  secs.forEach(s=>s&&io.observe(s));
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;
  try{const h=await open_(pw);try{sessionStorage.setItem('rvpw',pw)}catch(_){}show(h)}
  catch(_){document.getElementById('err').textContent='비밀번호가 맞지 않습니다';}
});
(async()=>{try{const s=sessionStorage.getItem('rvpw');if(s){show(await open_(s))}}catch(_){}})();
</script>
