<style>
:root{--d:'Orbitron','Noto Sans KR',sans-serif;--k:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;--cy:#4fe8ff;--pk:#ff4fb0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#03040c;overflow:hidden;touch-action:none;font-family:var(--k);color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#o{pointer-events:none}
.hide{display:none!important}
#hud{position:fixed;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top)}
#xpbar{height:6px;background:rgba(255,255,255,.08)}
#xpf{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fe8ff,#a06bff,#ff4fb0);box-shadow:0 0 16px #6fb0ff,0 0 4px #fff;transition:width .15s}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:10px 12px;gap:8px}
#tl{min-width:90px}
#lvl{font:900 15px var(--d);letter-spacing:2px;color:var(--cy);text-shadow:0 0 12px var(--cy);margin-bottom:6px}
#hpbar{position:relative;width:min(30vw,180px);height:10px;transform:skewX(-18deg);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.35);overflow:hidden}
#hpf{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff2a6a,#ff8a5a);box-shadow:0 0 12px #ff3a7a;transition:width .12s}
#inv{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;max-width:min(46vw,220px)}

#inv span{position:absolute;right:-2px;bottom:-5px;font:900 10px var(--d);color:#fff;text-shadow:0 0 4px #000,0 0 6px var(--cy)}
#tc{text-align:center;flex:1}

@media(min-width:700px){#bossbar{top:calc(env(safe-area-inset-top) + 64px)}}
#bossn{font:900 13px var(--d);letter-spacing:3px;color:#ff9ad0;text-shadow:0 0 12px #ff3a9a}
#bossbar div{height:8px;margin-top:4px;transform:skewX(-18deg);background:rgba(255,255,255,.1);border:1px solid #ff6ab8;overflow:hidden;box-shadow:0 0 18px rgba(255,60,160,.7)}

#tr{display:flex;gap:6px;align-items:center;min-width:90px;justify-content:flex-end}

#combo{position:absolute;right:14px;top:174px;font:900 26px var(--d);font-style:italic;color:#ffe45a;text-shadow:0 0 18px #ff9a2a,0 0 4px #fff;opacity:0;transition:opacity .2s;text-align:right}
#combo small{display:block;font-size:11px;letter-spacing:4px;color:#fff}
#toast{position:absolute;left:0;right:0;top:26%;text-align:center;font:900 clamp(15px,4.2vw,40px) var(--d);letter-spacing:1px;padding:0 10px;opacity:0;transition:opacity .35s,letter-spacing .6s;
  text-shadow:0 0 30px var(--pk),0 0 8px #fff}
#toast.on{opacity:1;letter-spacing:.22em}

#dash span{position:relative}
.touch #dash.show{display:block}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:18px;text-align:center;
  background:radial-gradient(ellipse at 50% 40%,rgba(10,14,50,.55),rgba(2,3,14,.9))}
#title{background:radial-gradient(ellipse at 50% 45%,rgba(2,3,14,.15),rgba(2,3,14,.7) 90%)}
.logoS{font:900 clamp(13px,3.4vw,20px) var(--d);letter-spacing:12px;color:var(--cy);text-shadow:0 0 16px var(--cy)}
.logo{font:900 clamp(40px,12.5vw,118px) var(--d);font-style:italic;line-height:.95;letter-spacing:-1px;color:#fff;
  text-shadow:0 0 8px #fff,0 0 28px var(--pk),0 0 70px var(--pk),0 0 120px #7a3aff;animation:flick 4s infinite}

@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.6}94%{opacity:1}96%{opacity:.75}97%{opacity:1}}
.sub{font-size:clamp(13px,3.6vw,18px);color:#cfe0ff;opacity:.9;max-width:560px;font-weight:500;line-height:1.6}
.btn{pointer-events:auto;font:900 clamp(17px,4.6vw,24px) var(--d);letter-spacing:5px;color:#fff;padding:16px 46px;border:2px solid var(--cy);border-radius:4px;transform:skewX(-12deg);
  background:linear-gradient(90deg,rgba(79,232,255,.25),rgba(255,79,176,.25));box-shadow:0 0 30px rgba(79,232,255,.6),inset 0 0 20px rgba(79,232,255,.3);animation:pulse 1.5s ease-in-out infinite}
.btn:active{background:rgba(79,232,255,.6)}
@keyframes pulse{50%{box-shadow:0 0 54px rgba(255,79,176,.8),inset 0 0 26px rgba(255,79,176,.4);border-color:var(--pk)}}
.btn2{pointer-events:auto;font:500 14px var(--k);color:#cfe0ff;padding:9px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);text-decoration:none}
.small{font-size:12.5px;color:#93a6d6;line-height:1.8}
.best{font:600 13px var(--d);letter-spacing:2px;color:#ffe45a;text-shadow:0 0 10px #ff9a2a}
h2{margin:0;font:900 clamp(28px,8vw,60px) var(--d);font-style:italic;letter-spacing:4px;text-shadow:0 0 8px #fff,0 0 34px var(--cy),0 0 80px #3a6aff}
#cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:100%;max-width:860px}
.card{pointer-events:auto;flex:1 1 220px;max-width:260px;min-height:170px;padding:18px 14px;border-radius:10px;border:1px solid rgba(120,220,255,.6);
  background:linear-gradient(160deg,rgba(30,60,140,.5),rgba(8,10,40,.85));box-shadow:0 0 26px rgba(60,160,255,.35),inset 0 0 30px rgba(60,160,255,.12);
  color:#fff;font-family:var(--k);animation:cardin .4s cubic-bezier(.2,1.4,.4,1) backwards;display:flex;flex-direction:column;align-items:center;gap:7px}
.card:nth-child(2){animation-delay:.08s}.card:nth-child(3){animation-delay:.16s}
.card:active{transform:scale(.96)}
.card.new{border-color:#ffe45a;box-shadow:0 0 30px rgba(255,200,60,.55),inset 0 0 30px rgba(255,200,60,.15)}
@keyframes cardin{from{opacity:0;transform:translateY(50px) scale(.8)}}
.card canvas{position:static;width:60px;height:60px}
.card .nm{font-size:19px;font-weight:900}
.card .lv{font:600 11px var(--d);letter-spacing:2px;color:#ffe45a}
.card .ds{font-size:13.5px;color:#cfdcff;line-height:1.4}
@media(max-width:560px){#cards{flex-direction:column;align-items:center}.card{flex:0 0 auto;width:100%;max-width:350px;min-height:0;flex-direction:row;text-align:left;gap:14px;padding:12px 16px}
  .card .tx{flex:1}.card canvas{width:52px;height:52px}}
.stats{display:grid;grid-template-columns:auto auto;gap:8px 26px;font-size:17px;text-align:left}
.stats b{font:900 18px var(--d);color:#ffe45a;text-align:right;text-shadow:0 0 10px #ff9a2a}
</style>
</head>
<body>
<canvas id="c"></canvas><canvas id="o"></canvas>
<div id="hud" class="hide">
  <div id="xpbar"><i id="xpf"></i></div>

</div>
<button id="dash"><i id="dashf"></i><span>DASH</span></button>
<div class="ov" id="title">
  <div class="logoS">COCO</div>
  <div class="logo">OVER<b>DRIVE</b></div>
  <div class="sub">네온 군단이 몰려온다. 움직이기만 하면 공격은 자동.<br>4개의 섹터, 4명의 보스 — 끝까지 살아남아라.</div>

</div>
<div class="ov hide" id="lvov"><h2 id="lvh">LEVEL UP</h2><div class="sub">강화할 능력을 하나 고르세요</div><div id="cards"></div></div>
<div class="ov hide" id="pauseov"><h2>PAUSED</h2><button class="btn" id="resb">RESUME</button><button class="btn2" id="quitb">처음 화면으로</button></div>
<div class="ov hide" id="overov"><h2 id="overh"></h2><div class="sub" id="overs"></div><div class="stats" id="stats"></div><button class="btn" id="againb">RETRY</button><button class="btn2" id="homeb">처음 화면으로</button></div>
<script>
(()=>{'use strict';
/* =====================================================================
   COCO OVERDRIVE — WebGL2 셰이더로 그리는 네온 서바이벌 슈팅
   (그림·소리 파일 없음: 모양은 수학 함수로, 소리는 신시사이저로 생성)
   ===================================================================== */
const TAU=Math.PI*2, $=id=>document.getElementById(id);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const cv=$('c'), ov=$('o'), o2=ov.getContext('2d');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){document.body.innerHTML='<div style="padding:40px;font:16px sans-serif;color:#fff">이 브라우저는 WebGL2를 지원하지 않아 게임을 실행할 수 없습니다. 최신 크롬/사파리에서 열어주세요.</div>';return;}
const HDR=!!gl.getExtension('EXT_color_buffer_float');
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');

/* ---------------- 셰이더 ---------------- */
const VSF=`#version 300 es
out vec2 vUv;void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));vUv=p;gl_Position=vec4(p*2.-1.,0.,1.);}`;
const FBG=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;
uniform vec4 uCam;uniform float uT;uniform vec4 uImp[12];uniform vec3 uA,uB,uC;
float h1(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float ns(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h1(i),h1(i+vec2(1,0)),f.x),mix(h1(i+vec2(0,1)),h1(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*ns(p);p=p*2.03+17.;a*=.5;}return s;}
void main(){
  vec2 sp=(vUv-.5)*uCam.zw*vec2(1.,-1.),w=uCam.xy+sp,wd=w;float en=0.;
  for(int i=0;i<12;i++){vec4 m=uImp[i];if(m.w==0.)continue;vec2 v=w-m.xy;float l=length(v)+.001,k;
    if(m.z>=0.){float q=(l-m.z)/70.;k=exp(-q*q)*m.w;}else{k=-m.w*exp(-l/(-m.z))*min(1.,l/30.);}
    wd+=v/l*k;en+=abs(k);}
  vec2 g1=wd/56.,g2=wd/224.;
  vec2 a1=abs(fract(g1-.5)-.5)/fwidth(g1),a2=abs(fract(g2-.5)-.5)/fwidth(g2);
  float l1=1.-min(min(a1.x,a1.y),1.),l2=1.-min(min(a2.x,a2.y)*.6,1.);
  float pulse=.75+.25*sin(uT*1.5+wd.x*.004+wd.y*.003);
  vec3 col=uA*(l1*.11+l2*.3)*pulse*(1.+en*.16)+uA*min(en,30.)*.004;
  vec2 nq=(uCam.xy*.3+sp)*.0019;float n=fbm(nq+vec2(uT*.012,0.)),n2=fbm(nq*1.9+n*1.7+7.3-vec2(0.,uT*.016));
  col+=uB*pow(n,2.6)*.3+uC*pow(n2,3.4)*.5;
  for(int L=0;L<2;L++){float f=L==0?.12:.3,sz=L==0?34.:60.;vec2 sq=(uCam.xy*f+sp)/sz,c=floor(sq),fr=fract(sq)-.5;float h=h1(c+float(L)*31.7);
    if(h>.9){vec2 of=vec2(h1(c+3.1),h1(c+7.7))-.5;float d=length(fr-of*.7);col+=vec3(.8,.9,1.)*smoothstep(.09,0.,d)*(.5+.5*sin(uT*(1.+h*4.)+h*60.))*(L==0?.5:.9);}}
  o=vec4(col+vec3(.004,.005,.014),1.);
}`;
const VSS=`#version 300 es
layout(location=0) in vec2 q;layout(location=1) in vec4 iPS;layout(location=2) in vec4 iRS;layout(location=3) in vec4 iC;
uniform vec4 uCam;uniform float uPx;
out vec2 vP;flat out vec4 vC;flat out vec3 vS;flat out float vPx;
void main(){float pad=(iRS.y<.5||iRS.y>10.5)?1.:1.7;vec2 l=q*pad;vP=l;vec2 w=l*iPS.zw;float c=cos(iRS.x),s=sin(iRS.x);
  w=vec2(c*w.x-s*w.y,s*w.x+c*w.y)+iPS.xy;vC=iC;vS=iRS.yzw;vPx=min(iPS.z,iPS.w)*uPx;
  gl_Position=vec4((w-uCam.xy)*uCam.zw*vec2(1.,-1.),0.,1.);}`;
const FSS=`#version 300 es
precision highp float;in vec2 vP;flat in vec4 vC;flat in vec3 vS;flat in float vPx;out vec4 o;
float ngon(vec2 p,float n){float s=6.2831853/n,a=atan(p.y,p.x)+s*.5;return cos(floor(a/s)*s+s*.5-a)*length(p)-cos(3.14159265/n);}
float sdStar(vec2 p,float r,float n,float m){float an=3.141593/n,en=3.141593/m;vec2 acs=vec2(cos(an),sin(an)),ecs=vec2(cos(en),sin(en));
  float bn=mod(atan(p.x,p.y),2.*an)-an;p=length(p)*vec2(cos(bn),abs(sin(bn)));p-=r*acs;p+=ecs*clamp(-dot(p,ecs),0.,r*acs.y/ecs.y);return length(p)*sign(p.x);}
float sdTri(vec2 p,vec2 a,vec2 b,vec2 c){vec2 e0=b-a,e1=c-b,e2=a-c,v0=p-a,v1=p-b,v2=p-c;
  vec2 q0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.,1.),q1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.,1.),q2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.,1.);
  float s=sign(e0.x*e2.y-e0.y*e2.x);vec2 d=min(min(vec2(dot(q0,q0),s*(v0.x*e0.y-v0.y*e0.x)),vec2(dot(q1,q1),s*(v1.x*e1.y-v1.y*e1.x))),vec2(dot(q2,q2),s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y);}
float sdBox(vec2 p,vec2 b){vec2 d=abs(p)-b;return length(max(d,0.))+min(max(d.x,d.y),0.);}
void main(){
  int sh=int(vS.x+.5);vec2 p=vP;
  if(sh==0){float r2=dot(p,p);float a=exp(-r2*5.)*(1.-smoothstep(.7,1.,sqrt(r2)));o=vec4((vC.rgb+vec3(.5)*exp(-r2*26.))*a*vC.a,0.);return;}
  if(sh==11){float ax=vS.y>.5?1.-smoothstep(.96,1.,abs(p.x)):1.-smoothstep(.1,1.,abs(p.x));float a=exp(-p.y*p.y*7.)*ax*(1.-smoothstep(.8,1.,abs(p.y)));
    o=vec4((vC.rgb+vec3(.7)*exp(-p.y*p.y*60.))*a*vC.a,0.);return;}
  float d;
  if(sh==1)d=length(p)-.94;
  else if(sh==2)d=ngon(p,vS.y);
  else if(sh==3)d=(abs(p.x)/.66+abs(p.y)-1.)*.55;
  else if(sh==4)d=sdStar(p,1.,vS.y,vS.y<4.5?2.3:2.9);
  else if(sh==5)d=max(length(p)-.96,-(length(p-vec2(.42,0.))-.8));
  else if(sh==6){float a=atan(p.y,p.x);d=(length(p)-(.6+.38*pow(abs(cos(a*4.)),1.6)))*.7;}
  else if(sh==7){vec2 s=vec2(p.x,abs(p.y));d=min(max(sdTri(p,vec2(1.,0.),vec2(-.72,.56),vec2(-.72,-.56)),-(length(p-vec2(-1.02,0.))-.5)),sdTri(s,vec2(-.05,.42),vec2(-.98,1.02),vec2(-.82,.3)));}
  else d=min(sdBox(p,vec2(.92,.3)),sdBox(p,vec2(.3,.92)));
  float aa=1.4/vPx,th=max(.05,1.15/vPx);
  float line=1.-smoothstep(th,th+aa,abs(d));
  float glow=exp(-abs(d)*8.)*.42+exp(-abs(d)*2.6)*.09;
  float fill=d<0.?(.07+vS.z*.9):0.;
  float edge=1.-smoothstep(1.25,1.68,max(abs(p.x),abs(p.y)));
  vec3 col=vC.rgb*(line*1.5+glow+fill)+vec3(line*.5+vS.z*step(d,0.)*.6);
  o=vec4(col*vC.a*edge,0.);
}`;
const FDN=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform vec2 uH;uniform float uThr;
void main(){vec3 c=texture(uTex,vUv).rgb*4.;c+=texture(uTex,vUv-uH).rgb+texture(uTex,vUv+uH).rgb+texture(uTex,vUv+vec2(uH.x,-uH.y)).rgb+texture(uTex,vUv-vec2(uH.x,-uH.y)).rgb;c/=8.;
  if(uThr>0.){float b=max(c.r,max(c.g,c.b));c*=max(b-uThr,0.)/max(b,1e-4);c=min(c,vec3(8.));}o=vec4(c,1.);}`;
const FUP=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uTex;uniform vec2 uH;
void main(){vec3 c=texture(uTex,vUv+vec2(-uH.x*2.,0.)).rgb+texture(uTex,vUv+vec2(uH.x*2.,0.)).rgb+texture(uTex,vUv+vec2(0.,uH.y*2.)).rgb+texture(uTex,vUv+vec2(0.,-uH.y*2.)).rgb;
  c+=(texture(uTex,vUv+vec2(-uH.x,uH.y)).rgb+texture(uTex,vUv+uH).rgb+texture(uTex,vUv+vec2(uH.x,-uH.y)).rgb+texture(uTex,vUv-uH).rgb)*2.;o=vec4(c/12.,1.);}`;
const FCP=`#version 300 es
precision highp float;in vec2 vUv;out vec4 o;uniform sampler2D uScene,uBloom;uniform vec4 uSW[6];uniform float uCA,uT,uAsp,uBk,uFade;uniform vec3 uFlash;
vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}

  const m=time/60,vr=viewR()+50;
  if(!demo&&nextBoss<4&&time>=BOSS[nextBoss].at){spawnBoss(nextBoss);nextBoss++;}
  const cap=110+m*26;
  spawnAcc+=dt*(1.9+m*.85+(m>5?(m-5)*.6:0))*(bosses.length?.55:1)*(demo?1.6:1);
  while(spawnAcc>=1){spawnAcc--;if(E.length>cap)continue;
    const w=[['drift',m<4?10:3],['dart',m>.5?5:0],['split',m>2?5:0],['bomber',m>1.4?3:0],['weaver',m>3?4:0],['tank',m>4.5?2:0]];
    let tot=0;for(const x of w)tot+=x[1];let r=Math.random()*tot,ty='drift';for(const x of w){r-=x[1];if(r<=0){ty=x[0];break;}}
    const a=rnd(TAU);spawn(ty,P.x+Math.cos(a)*vr,P.y+Math.sin(a)*vr,{elite:m>1&&Math.random()<.014});}
  swarmT-=dt;if(swarmT<=0){swarmT=rnd(24,34);const n=Math.min(36,10+m*3|0),ty=m>3&&Math.random()<.4?'bomber':'dart',a0=rnd(TAU);
    if(Math.random()<.5)for(let i=0;i<n;i++){const a=a0+i/n*TAU;spawn(ty,P.x+Math.cos(a)*vr,P.y+Math.sin(a)*vr);}
    else for(let i=0;i<n;i++)spawn(ty,P.x+Math.cos(a0)*vr+rnd(-90,90),P.y+Math.sin(a0)*vr+rnd(-90,90));}
}
function bossAI(e,dt,dx,dy,d){

    if(e.mode===1){e.mt+=dt;if(e.mt<.7){e.flash=.04;return 0;}
      if(e.mt<1.15){e.x+=e.tx*760*dt;e.y+=e.ty*760*dt;part(e.x+rnd(-20,20),e.y+rnd(-20,20),0,0,.4,5,C.pk,0,0);return 0;}
      e.mode=0;shake=12;sfx('boom');ring(e.x,e.y,240,'pk',.5,70,.03);const n=rage?18:12;for(let i=0;i<n;i++)ebullet(e.x,e.y,i/n*TAU+e.spin,140,12);e.spin+=.3;return 0;}

  }else if(ai==='titan'){

    if(e.t1<=0){e.t1=rage?1.7:2.5;const a=Math.atan2(dy,dx);for(let i=-2;i<=2;i++)ebullet(e.x,e.y,a+i*.2,170,12);sfx('bshot');}

    if(e.t2<=0){e.t2=rage?.22:.34;for(let i=0;i<3;i++)ebullet(e.x,e.y,e.spin+i*TAU/3,150,11);}

    if(e.mode===1){e.mt+=dt;e.spin+=dt*(rage?5:3.6);if(((e.mt*1000)|0)%90<dt*1000){ebullet(e.x,e.y,e.spin,150,13);ebullet(e.x,e.y,e.spin+Math.PI,150,13);if(rage){ebullet(e.x,e.y,e.spin+1.57,150,13);ebullet(e.x,e.y,e.spin-1.57,150,13);}}
      if(e.mt>2.2)e.mode=0;return sp*.3;}
    if(e.t1<=0){e.t1=4.6;e.mode=1;e.mt=0;sfx('bshot');}
    if(e.t2<=0){e.t2=rage?5:7;burst(e.x,e.y,50,C.yl,500,3,.6);const a=rnd(TAU);e.x=P.x+Math.cos(a)*250;e.y=P.y+Math.sin(a)*250;burst(e.x,e.y,50,C.yl,500,3,.6);ring(e.x,e.y,220,'yl',.5,70,.03);sfx('nova');
      const n=rage?24:16;for(let i=0;i<n;i++)ebullet(e.x,e.y,i/n*TAU,120,13);}
    if(e.t3<=0){e.t3=rage?5.5:7.5;const a=Math.atan2(dy,dx)-.9;fx.push({k:'laser',src:e,ang:a,w:(rage?1:.75),t:0,d:3,len:1100});sfx('laser');}

}
function update(dt){

  else{const k=Math.min(1,dt*12);P.vx=lerp(P.vx,mx*sp,k);P.vy=lerp(P.vy,my*sp,k);}

    const ta=P.moving?Math.atan2(P.dy,P.dx):P.ang;let da=ta-P.ang;while(da>Math.PI)da-=TAU;while(da<-Math.PI)da+=TAU;P.ang+=da*Math.min(1,dt*12);
    if(P.moving&&Math.random()<dt*70*PQ)part(P.x-Math.cos(P.ang)*12+rnd(-3,3),P.y-Math.sin(P.ang)*12+rnd(-3,3),-P.vx*.4+rnd(-30,30),-P.vy*.4+rnd(-30,30),.35,3.5,Math.random()<.5?C.cy:C.pk,1.5);}
  if(L('hp')&&P.hp<P.maxhp&&P.hp>0)P.hp=Math.min(P.maxhp,P.hp+.45*L('hp')*dt);
  comboT-=dt;if(comboT<=0)combo=0;gemT-=dt;if(gemT<=0)gemChain=0;

      if(hit||s.l<=0){s.l=0;sfx('boom',.1);shake=Math.max(shake,5);ring(s.x,s.y,s.R*1.3,'yl',.35,34,.012);burst(s.x,s.y,22,C.yl,380,3,.5);burst(s.x,s.y,10,C.or,240,3,.5);fx.push({k:'flash',x:s.x,y:s.y,t:0,d:.16,R:s.R*2.4,col:'yl'});
        query(s.x,s.y,s.R,e=>{const q=Math.hypot(e.x-s.x,e.y-s.y)||1;dmg(e,s.d,(e.x-s.x)/q,(e.y-s.y)/q,200);});}}
  }
  shots=shots.filter(s=>s.l>0);
  for(const b of ebul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;const dx=b.x-P.x,dy=b.y-P.y;if(alive&&dx*dx+dy*dy<(P.r+4)**2){hurt(b.dmg);b.l=0;burst(b.x,b.y,8,C.rd,200,2.5,.3);}}
  ebul=ebul.filter(b=>b.l>0);
  for(const f of fx){f.t+=dt;

      for(const b of ebul){if((b.x-P.x)**2+(b.y-P.y)**2<r*r){b.l=0;burst(b.x,b.y,4,C.pk,160,2,.25);}}}
    else if(f.k==='hole'){
      if(f.t<f.d-.25){f.tk-=dt;const tick=f.tk<=0;if(tick)f.tk=.25;
        for(const e of E){if(e.dead)continue;const dx=f.x-e.x,dy=f.y-e.y,d=Math.hypot(dx,dy);if(d<f.R*1.25){if(!e.boss){e.x+=dx*Math.min(1,dt*2.6);e.y+=dy*Math.min(1,dt*2.6);}if(tick&&d<f.R)dmg(e,f.dm);}}
        for(let i=0;i<2;i++){if(Math.random()<PQ){const a=rnd(TAU),r=f.R*rnd(.6,1.1);part(f.x+Math.cos(a)*r,f.y+Math.sin(a)*r,-Math.cos(a)*r*1.6-Math.sin(a)*140,-Math.sin(a)*r*1.6+Math.cos(a)*140,.5,3,Math.random()<.5?C.vi:C.pk,.5);}}}
      else if(!f.done){f.done=true;sfx('boom');shake=Math.max(shake,12);ca=Math.max(ca,.02);ring(f.x,f.y,f.R*1.8,'vi',.5,80,.035);burst(f.x,f.y,60,C.vi,620,3.5,.8);burst(f.x,f.y,24,C.wh,380,2.5,.5);fx.push({k:'flash',x:f.x,y:f.y,t:0,d:.2,R:f.R*3,col:'vi'});

const IMP=new Float32Array(48),SW=new Float32Array(24),TC=[0,0,0];
function drawBoss(e){

  S(e.x,e.y,r*3.2,r*3.2,0,0,c,.35);
  S(e.x,e.y,r*1.25*pu,r*1.25*pu,t*.5,2,c,1,n,f);
  S(e.x,e.y,r*.95,r*.95,-t*.9,2,c,.9,n,f);
  S(e.x,e.y,r*.6,r*.6,t*1.6,4,C.wh,.9,n<5?4:5,.1);
  S(e.x,e.y,r*.26,r*.26,0,1,C.wh,1,0,.8);
  const k=n<5?3:n>6?8:6;for(let i=0;i<k;i++){const a=t*1.4+i*TAU/k,rr=r*1.75+Math.sin(t*3+i)*6;S(e.x+Math.cos(a)*rr,e.y+Math.sin(a)*rr,r*.2,r*.2,a*2,3,c,1,0,.25);}
  S(e.x,e.y,r*2.1,r*2.1,0,1,c,.3+Math.sin(t*4)*.1);

function render(){
