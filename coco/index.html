<!DOCTYPE html>

<head>

<style>
:root{--f:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0a24;overflow:hidden;touch-action:none;font-family:var(--f);color:#fff;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.hide{display:none!important}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(6,4,30,.55) 100%)}

#hud{position:fixed;inset:0;pointer-events:none;padding-top:env(safe-area-inset-top)}
#xpbar{height:12px;background:rgba(10,8,40,.7);border-bottom:1px solid rgba(255,255,255,.15)}
#xpf{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ad8ff,#8a7bff,#ff6ad8);box-shadow:0 0 14px #7a8bff;border-radius:0 6px 6px 0;transition:width .15s}
#top{display:flex;justify-content:space-between;align-items:flex-start;padding:8px 10px;gap:8px}
#tl{min-width:130px}
#lvl{font-size:18px;text-shadow:0 2px 0 #1a1040;margin-bottom:4px}
#lvl b{color:#ffe14d;font-weight:400}
#hpbar{position:relative;width:min(38vw,170px);height:16px;border-radius:9px;background:rgba(10,8,40,.75);border:1.5px solid rgba(255,255,255,.35);overflow:hidden}
#hpf{display:block;height:100%;width:100%;background:linear-gradient(180deg,#ff8aa0,#ff3b6e);transition:width .12s}
#hpt{position:absolute;inset:0;text-align:center;font-size:11px;line-height:14px;text-shadow:0 1px 0 #400}
#inv{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;max-width:min(46vw,210px)}

@media(min-width:700px){#bossbar{top:calc(env(safe-area-inset-top) + 62px)}}

#bossbar div{height:12px;border-radius:7px;background:rgba(10,8,40,.8);border:1.5px solid #ff7ab0;overflow:hidden;box-shadow:0 0 14px rgba(255,60,140,.6)}

#toast{position:absolute;left:0;right:0;top:27%;text-align:center;font-size:clamp(22px,5.5vw,40px);opacity:0;transition:opacity .35s,transform .35s;transform:scale(.8);
  text-shadow:0 3px 0 #2a1060,0 0 26px rgba(255,120,220,.9)}

#dash{position:fixed;right:22px;bottom:calc(26px + env(safe-area-inset-bottom));width:86px;height:86px;border-radius:50%;display:none;
  border:2px solid rgba(255,255,255,.6);background:radial-gradient(circle at 35% 30%,rgba(120,230,255,.55),rgba(60,90,255,.35));color:#fff;font:400 20px var(--f);
  box-shadow:0 0 22px rgba(90,200,255,.55);overflow:hidden}

.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;
  background:radial-gradient(ellipse at 50% 35%,rgba(40,30,110,.55),rgba(6,4,26,.86));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#title{background:radial-gradient(ellipse at 50% 40%,rgba(30,20,90,.2),rgba(6,4,26,.72));backdrop-filter:none;-webkit-backdrop-filter:none}
.logoS{font-size:clamp(18px,4.5vw,30px);color:#bfe9ff;text-shadow:0 2px 0 #16306e;letter-spacing:4px}
.logo{font-size:clamp(46px,13vw,104px);line-height:1;background:linear-gradient(180deg,#fffbd0 10%,#ffd23a 45%,#ff7a3d 80%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #4a1a7a) drop-shadow(0 0 26px rgba(255,170,60,.65));animation:bob 2.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}

.btn{pointer-events:auto;font:400 clamp(20px,5vw,28px) var(--f);color:#3a1600;padding:14px 44px;border:none;border-radius:999px;
  background:linear-gradient(180deg,#fff3a0,#ffc21a 55%,#ff9020);box-shadow:0 6px 0 #a84a00,0 10px 30px rgba(255,170,40,.55);animation:pulse 1.4s ease-in-out infinite}

@keyframes pulse{50%{transform:scale(1.05)}}
.btn2{pointer-events:auto;font:400 16px var(--f);color:#fff;padding:9px 22px;border-radius:999px;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);text-decoration:none}
.small{font-size:13px;color:#b9b6e6;line-height:1.7}
.best{font-size:15px;color:#ffe14d}
h2{margin:0;font-weight:400;font-size:clamp(30px,8vw,56px);text-shadow:0 4px 0 #2a1060,0 0 26px rgba(140,160,255,.8)}
#lvh{color:#ffe14d}
#cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;width:100%;max-width:820px}
.card{pointer-events:auto;flex:1 1 210px;max-width:250px;min-height:150px;padding:14px 12px;border-radius:18px;border:2px solid rgba(160,170,255,.55);
  background:linear-gradient(170deg,rgba(60,50,150,.92),rgba(22,16,66,.95));box-shadow:0 8px 26px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);
  color:#fff;font-family:var(--f);animation:cardin .35s cubic-bezier(.2,1.4,.4,1) backwards;display:flex;flex-direction:column;align-items:center;gap:6px}
.card:nth-child(2){animation-delay:.07s}.card:nth-child(3){animation-delay:.14s}
.card:active{transform:scale(.96)}

@keyframes cardin{from{opacity:0;transform:translateY(40px) scale(.8)}}
.card canvas{position:static;width:56px;height:56px}
.card .nm{font-size:20px}
.card .lv{font-size:13px;color:#ffe14d}
.card .ds{font-size:13.5px;color:#d9d6ff;line-height:1.35}
@media(max-width:560px){#cards{flex-direction:column;align-items:center}.card{flex:0 0 auto;width:100%;max-width:340px;min-height:0;flex-direction:row;text-align:left;gap:12px;padding:10px 14px}
  .card .tx{flex:1}.card canvas{width:50px;height:50px}}
.stats{display:grid;grid-template-columns:auto auto;gap:6px 22px;font-size:19px;text-align:left}
.stats b{color:#ffe14d;font-weight:400;text-align:right}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="vig"></div><div id="hurt"></div><div id="flash"></div>
<div id="hud" class="hide">

  <div id="top">
    <div id="tl"><div id="lvl"></div><div id="hpbar"><i id="hpf"></i><span id="hpt"></span></div><div id="inv"></div></div>
    <div id="tc"><div id="time">0:00</div><div id="bossbar" class="hide"><span id="bossn"></span><div><i id="bossf"></i></div></div></div>
    <div id="tr"><div id="kills"></div><button class="ib" id="mbtn">♪</button><button class="ib" id="pbtn">Ⅱ</button></div>
  </div>
  <div id="combo"></div><div id="toast"></div>
</div>
<button id="dash"><i id="dashf"></i><span>대시</span></button>
<div class="ov" id="title">
  <canvas id="th" width="280" height="240" style="position:static;width:140px;height:120px;margin-bottom:-14px"></canvas>
  <div class="logoS">코 코</div>
  <div class="logo">별빛 수호자</div>
  <div class="sub">몰려오는 그림자 군단에서 살아남아<br>네 명의 보스를 물리치고 별빛을 지켜라!</div>

<div class="ov hide" id="pauseov"><h2>일시정지</h2><button class="btn" id="resb">계속하기</button><button class="btn2" id="quitb">처음 화면으로</button></div>
<div class="ov hide" id="overov"><h2 id="overh"></h2><div class="sub" id="overs"></div><div class="stats" id="stats"></div><button class="btn" id="againb">다시 도전</button><button class="btn2" id="homeb">처음 화면으로</button></div>
<script>
(()=>{'use strict';
/* =====================================================================
   코코: 별빛 수호자 — 그림·소리 파일 없이 전부 코드로 그리고 합성한 서바이벌 액션
   ===================================================================== */
const TAU=Math.PI*2, $=id=>document.getElementById(id);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hash2=(x,y)=>{let n=Math.imul(x,374761393)^Math.imul(y,668265263);n=Math.imul(n^n>>>13,1274126177);return(n^n>>>16)>>>0;};
const cv=$('c'), ctx=cv.getContext('2d');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;};
let CW=1,CH=1,Z=1,DPR=1, lightC=mkc(4,4), lctx=lightC.getContext('2d');
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);CW=cv.width=Math.max(2,innerWidth*DPR|0);CH=cv.height=Math.max(2,innerHeight*DPR|0);
  Z=Math.sqrt(CW*CH/(900*560));
  lightC=mkc(CW/4,CH/4);lctx=lightC.getContext('2d');
}
addEventListener('resize',resize);resize();

/* ---------------- 입력: 키보드 + 어디든 누르면 생기는 조이스틱 ---------------- */
const keys={}, joy={on:false,id:-1,sx:0,sy:0,x:0,y:0,cx:0,cy:0};
let dashReq=false;
const KM={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'U',KeyW:'U',ArrowDown:'D',KeyS:'D'};
addEventListener('keydown',e=>{
  audioInit();
  if(KM[e.code]){keys[KM[e.code]]=1;e.preventDefault();return;}
  if(e.repeat)return;
  if(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'){e.preventDefault();if(state==='play')dashReq=true;else if(state==='title')startGame();}
  else if(e.code==='Enter'){if(state==='title')startGame();else if(state==='over')startGame();}
  else if(e.code==='KeyP'||e.code==='Escape')togglePause();
  else if(e.code==='KeyM')toggleMute();
  else if(state==='levelup'&&/^Digit[123]$/.test(e.code)){const b=$('cards').children[+e.code.slice(5)-1];if(b)b.click();}
});
addEventListener('keyup',e=>{if(KM[e.code])keys[KM[e.code]]=0;});
const isTouch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
if(isTouch)document.body.classList.add('touch');
cv.addEventListener('pointerdown',e=>{e.preventDefault();audioInit();
  if(state!=='play')return;
  if(!joy.on){joy.on=true;joy.id=e.pointerId;joy.sx=joy.cx=e.clientX;joy.sy=joy.cy=e.clientY;joy.x=joy.y=0;}
  else dashReq=true;});
addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;
  let dx=e.clientX-joy.sx,dy=e.clientY-joy.sy;const d=Math.hypot(dx,dy),M=52;
  if(d>M){joy.sx+=dx*(1-M/d);joy.sy+=dy*(1-M/d);dx*=M/d;dy*=M/d;}
  joy.cx=e.clientX;joy.cy=e.clientY;const q=Math.min(1,d/M);joy.x=d>6?dx/Math.max(d,1)*q*(M/Math.min(d,M))*Math.min(d,M)/M:0;joy.y=d>6?dy/Math.max(d,1)*q*(M/Math.min(d,M))*Math.min(d,M)/M:0;
  if(d>6){const n=Math.hypot(dx,dy)||1;joy.x=dx/n*Math.min(1,n/M*1.25);joy.y=dy/n*Math.min(1,n/M*1.25);}});
const jend=e=>{if(e.pointerId===joy.id){joy.on=false;joy.x=joy.y=0;}};
addEventListener('pointerup',jend);addEventListener('pointercancel',jend);
addEventListener('contextmenu',e=>e.preventDefault());
$('dash').addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();dashReq=true;});

/* ---------------- 소리: WebAudio로 직접 합성 ---------------- */
let AC=null,master,musG,sfxG,dly,bassLP,nbuf,muted=false;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:.6;
  const comp=AC.createDynamicsCompressor();master.connect(comp);comp.connect(AC.destination);
  musG=AC.createGain();musG.gain.value=.5;musG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=.7;sfxG.connect(master);
  dly=AC.createDelay(1);dly.delayTime.value=.3;const fb=AC.createGain();fb.gain.value=.34;dly.connect(fb);fb.connect(dly);
  const wet=AC.createGain();wet.gain.value=.4;dly.connect(wet);wet.connect(musG);
  bassLP=AC.createBiquadFilter();bassLP.type='lowpass';bassLP.frequency.value=520;bassLP.connect(musG);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function osc(type,f0,f1,t,dur,vol,dest,att){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  if(att){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+att);}else g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(.0008,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.03);return g;
}
function nz(t,dur,vol,dest,type,freq){
  const s=AC.createBufferSource(),g=AC.createGain();s.buffer=nbuf;s.loop=true;
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  if(type){const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;s.connect(f);f.connect(g);}else s.connect(g);
  g.connect(dest);s.start(t,Math.random());s.stop(t+dur+.03);
}
const sl={};
function sfx(n,gap=.04){if(!AC||AC.state!=='running')return;const t=AC.currentTime;if(sl[n]&&t-sl[n]<gap)return;sl[n]=t;S[n](t);}
const tn=(ty,a,b,t,d,v)=>osc(ty,a,b,t,d,v,sfxG);
const S={
  shoot(t){tn('triangle',900,420,t,.07,.08);},
  hit(t){tn('square',220,110,t,.04,.05);},
  pop(t){tn('sine',520+rnd(160),160,t,.1,.16);nz(t,.05,.06,sfxG,'highpass',2500);},
  gem(t){const f=660*Math.pow(1.06,Math.min(gemChain,14));tn('sine',f,f*1.5,t,.09,.12);},
  lvl(t){[523,659,784,1047,1319,1568].forEach((f,i)=>{tn('square',f,f,t+i*.06,.14,.12);tn('triangle',f*2,f*2,t+i*.06,.2,.08);});},
  pick(t){[784,1047,1568].forEach((f,i)=>tn('triangle',f,f,t+i*.05,.14,.2));},
  hurt(t){tn('sawtooth',300,70,t,.3,.25);nz(t,.12,.2,sfxG,'lowpass',900);},
  dash(t){nz(t,.22,.22,sfxG,'bandpass',1800);tn('sine',300,900,t,.16,.1);},
  zap(t){nz(t,.14,.2,sfxG,'highpass',3000);tn('sawtooth',1400,200,t,.12,.1);},
  boom(t){tn('sine',140,30,t,.45,.6);nz(t,.35,.35,sfxG,'lowpass',700);},
  nova(t){tn('sine',200,700,t,.3,.14);nz(t,.3,.1,sfxG,'bandpass',1200);},
  swish(t){nz(t,.12,.08,sfxG,'bandpass',2600);},
  warn(t){for(let i=0;i<3;i++){tn('sawtooth',220,220,t+i*.32,.22,.2);tn('sawtooth',233,233,t+i*.32,.22,.2);}},
  bossdie(t){for(let i=0;i<6;i++){tn('sine',160-i*15,30,t+i*.12,.4,.5);nz(t+i*.12,.3,.3,sfxG,'lowpass',900);}},
  win(t){[523,659,784,1047,784,1047,1319,1568,2093].forEach((f,i)=>{tn('square',f,f,t+i*.12,.22,.14);tn('triangle',f/2,f/2,t+i*.12,.3,.2);});},
  lose(t){[392,349,311,262,196,131].forEach((f,i)=>tn('triangle',f,f*.97,t+i*.2,.3,.3));},
  sel(t){tn('square',660,990,t,.08,.12);},
  bshot(t){tn('square',180,90,t,.12,.07);}
};
/* 배경음악: 월드마다 코드 진행이 다르고, 진행될수록 악기가 겹쳐집니다 */
const NN={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
const chord=s=>{let n=NN[s[0]],i=1;if(s[i]==='b'){n--;i++;}return{r:n,m:s[i]==='m'};};
const PROG=[['C','G','Am','F'],['Am','F','C','G'],['Em','C','Am','B'],['Dm','Bb','F','C']].map(p=>p.map(chord));
const mf=m=>440*Math.pow(2,(m-69)/12);
const LEAD=[2,-1,1,2,3,-1,2,-1,1,-1,0,1,2,-1,-1,-1, 3,-1,2,3,4,-1,3,-1,2,-1,1,2,0,-1,-1,-1];
let musOn=false,mStep=0,mTime=0;
setInterval(()=>{
  if(!AC||!musOn||AC.state!=='running')return;
  if(mTime<AC.currentTime)mTime=AC.currentTime+.04;
  const it=state==='title'?0:biome, bossy=bosses.length>0, bpm=112+it*5+(bossy?8:0), sd=15/bpm;
  while(mTime<AC.currentTime+.2){

function buildGrid(){if(grid.size>3000)grid.clear();for(const a of grid.values())a.length=0;
  for(const e of E){if(e.dead||e.boss)continue;const k=gkey(e.x,e.y);let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(e);}}
function query(x,y,r,fn){
  const R=r+28,x0=Math.floor((x-R)/GC),x1=Math.floor((x+R)/GC),y0=Math.floor((y-R)/GC),y1=Math.floor((y+R)/GC);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get((cx+32768)*65536+(cy+32768));if(!a)continue;
    for(let i=0;i<a.length;i++){const e=a[i];if(e.dead)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr)fn(e);}}
  for(const e of bosses){if(e.dead||e.z>30)continue;const dx=e.x-x,dy=e.y-y,rr=r+e.r;if(dx*dx+dy*dy<rr*rr)fn(e);}
}

function update(dt){
  gt+=dt;

  dt*=slow;time+=dt;
  // --- 코코 이동 ---
  let mx=(keys.R?1:0)-(keys.L?1:0)+joy.x,my=(keys.D?1:0)-(keys.U?1:0)+joy.y;const ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;}P.moving=ml>.12;

  else if(P.moving){const sp=188*(1+.08*L('spd'));P.x+=mx*sp*dt;P.y+=my*sp*dt;}
  if(L('hp')&&P.hp<P.maxhp)P.hp=Math.min(P.maxhp,P.hp+.45*L('hp')*dt);
  comboT-=dt;if(comboT<=0)combo=0;gemT-=dt;if(gemT<=0)gemChain=0;
  spawner(dt);buildGrid();weapons(dt);
  // --- 적 ---
  const far=viewR()*1.7,vr=viewR()+40;
  for(const e of E){
    if(e.dead)continue;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)||1;
    if(!e.boss&&d>far){const a=rnd(TAU);e.x=P.x+Math.cos(a)*vr;e.y=P.y+Math.sin(a)*vr;continue;}
    let sp=e.spd;if(e.boss)sp=bossAI(e,dt,dx,dy,d);
    if(sp>0){let vx=dx/d*sp,vy=dy/d*sp;if(e.t.wave){const w=Math.sin(gt*3.5+e.ph)*e.t.wave;vx-=dy/d*w;vy+=dx/d*w;}e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;}
    const kd=Math.max(0,1-dt*7);e.kx*=kd;e.ky*=kd;
    if(!e.boss){const a=grid.get(gkey(e.x,e.y));if(a)for(let i=0;i<a.length;i++){const o=a[i];if(o===e||o.dead)continue;const ox=e.x-o.x,oy=e.y-o.y,od=ox*ox+oy*oy,rr=(e.r+o.r)*.9;
        if(od<rr*rr&&od>.01){const q=Math.sqrt(od),p=(rr-q)/q*Math.min(.5,dt*8);e.x+=ox*p;e.y+=oy*p;}}
      if(e.t.shoot){e.st-=dt;if(e.st<=0&&d<430){e.st=e.t.shoot;ebullet(e.x,e.y-16,Math.atan2(dy,dx),135,9);sfx('bshot',.2);}}}
    if(e.flash>0)e.flash-=dt;
    if(d<e.r+P.r-3&&e.z<25)hurt(e.dmg);
  }
  if(E.some(e=>e.dead))E=E.filter(e=>!e.dead);

  const am=BIO[biome].amb;if(am==='fire')ctx.globalCompositeOperation='lighter';
  for(const p of amb){
    let px=p.x*CW,py=p.y*CH;const u=DPR*p.s;
    px=(((px-cam.x*Z*.6+(am==='leaf'?gt*40*p.s:am==='snow'?Math.sin(gt+p.p)*30:Math.sin(gt*.6+p.p)*40)*DPR)%CW)+CW)%CW;
    py=(((py-cam.y*Z*.6+(am==='snow'?gt*70*p.s:am==='leaf'?gt*46*p.s:am==='fire'?-gt*14*p.s:Math.cos(gt*.5+p.p)*30)*DPR)%CH)+CH)%CH;
    if(am==='pollen'){ctx.globalAlpha=.55;ctx.fillStyle='#fffbd0';ctx.beginPath();ctx.arc(px,py,2.2*u,0,TAU);ctx.fill();}
    else if(am==='leaf'){ctx.globalAlpha=.8;ctx.fillStyle=p.p>3?'#ff7a2a':'#ffc040';ctx.beginPath();ctx.ellipse(px,py,5*u,2.4*u,gt*2+p.p,0,TAU);ctx.fill();}
    else if(am==='fire'){ctx.globalAlpha=.35+Math.sin(gt*3+p.p)*.3;const s=26*u;ctx.drawImage(p.p>3?GL.c:GL.p,px-s/2,py-s/2,s,s);}
    else{ctx.globalAlpha=.85;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(px,py,2.6*u,0,TAU);ctx.fill();}
  }
  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  // 코코 머리 위 체력바 · 피해 숫자 · 조이스틱
  if(state==='play'||state==='levelup'||state==='pause'){
    const X=(P.x-cam.x)*Z+CW/2+SX,Y=(P.y-cam.y)*Z+CH/2+SY,w=44*Z,h=5*Z;
    ctx.fillStyle='rgba(10,5,40,.7)';ctx.fillRect(X-w/2-1,Y+8*Z-1,w+2,h+2);ctx.fillStyle=P.hp/P.maxhp<.35?'#ff3b5a':'#5fe87a';ctx.fillRect(X-w/2,Y+8*Z,w*clamp(P.hp/P.maxhp,0,1),h);
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
    for(const n of nums){const q=n.t/.7,sz=(n.big?24:16)*Z*(q<.15?.6+q/.15*.6:1.2-q*.25);ctx.font='400 '+(sz|0)+'px Jua,sans-serif';ctx.globalAlpha=q>.6?(1-q)/.4:1;
      const nx=(n.x-cam.x)*Z+CW/2+SX,ny=(n.y-q*34-cam.y)*Z+CH/2+SY;ctx.lineWidth=3.5*DPR;ctx.strokeStyle='rgba(20,8,50,.85)';ctx.strokeText(n.v,nx,ny);ctx.fillStyle=n.col;ctx.fillText(n.v,nx,ny);}
    ctx.globalAlpha=1;
    if(joy.on&&state==='play'){const jx=joy.sx*DPR,jy=joy.sy*DPR,R=52*DPR;ctx.lineWidth=2.5*DPR;ctx.strokeStyle='rgba(255,255,255,.45)';ctx.fillStyle='rgba(255,255,255,.08)';
      ctx.beginPath();ctx.arc(jx,jy,R,0,TAU);ctx.fill();ctx.stroke();ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.arc(jx+joy.x*R*.8,jy+joy.y*R*.8,22*DPR,0,TAU);ctx.fill();}
  }
}
const RC={y:'#ffd850',o:'#ff8a30',c:'#60e0ff',p:'#ff70d0',g:'#70ff98',w:'#ffffff',r:'#ff4868',v:'#a878ff',b:'#5088ff'};
const hc={};
function setH(id,prop,v){const k=id+prop;if(hc[k]===v)return;hc[k]=v;if(prop==='text')$(id).textContent=v;else $(id).style[prop]=v;}
function hud(){
  setH('xpf','width',(P.xp/P.need*100).toFixed(1)+'%');
  if(hc.lv!==P.lvl){hc.lv=P.lvl;$('lvl').innerHTML='Lv <b>'+P.lvl+'</b>';}
  setH('hpf','width',(clamp(P.hp/P.maxhp,0,1)*100).toFixed(0)+'%');setH('hpt','text',Math.ceil(P.hp)+' / '+P.maxhp);
  setH('time','text',fmt(time));setH('kills','text','처치 '+kills);
  if(bosses.length)setH('bossf','width',(clamp(bosses[0].hp/bosses[0].mhp,0,1)*100).toFixed(1)+'%');
  setH('combo','opacity',combo>=10?1:0);if(combo>=10)setH('combo','text',combo+' COMBO!');
  setH('dashf','height',(clamp(P.dashCd/2,0,1)*100).toFixed(0)+'%');
}
let last=0;const thx=$('th').getContext('2d');
function frame(t){
  requestAnimationFrame(frame);
  let dt=Math.min(.05,(t-last)/1000);last=t;if(dt<=0)return;
  update(dt);render();if(state!=='title')hud();else{const x=thx;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,280,240);x.setTransform(3.4,0,0,3.4,150,215);drawHero(x,gt,true,false);}
}
setAmb();showBest();
window.__g={get s(){return{state,time,kills,P,E,bosses,gems,biome,parts,shots,ebul};},update,render,start:startGame,pick:pickUp,god:v=>{god=v;},keys,
  set:(k,v)=>{if(k==='time')time=v;if(k==='biome'){bFrom=biome;biome=v;bMix=1;setAmb();}}};
requestAnimationFrame(frame);
})();
