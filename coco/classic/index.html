const TS=16, VH=272, FONT="'Trebuchet MS','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif";

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
const hash=n=>{n=Math.imul(n^0x9e3779b9,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);return((n^n>>>16)>>>0);};
let skyC=null;
function resize(){
  const dpr=Math.min(window.devicePixelRatio||1,2), cw=innerWidth, ch=innerHeight;
  cv.width=Math.max(1,cw*dpr|0); cv.height=Math.max(1,ch*dpr|0);
  VW=clamp(Math.round(VH*cw/ch),320,576);
  scale=Math.min(cv.width/VW,cv.height/VH);
  offX=(cv.width-VW*scale)/2|0;
  offY=ch>cw?((cv.height-VH*scale)*0.22|0):((cv.height-VH*scale)/2|0);
  lo.width=VW; lo.height=VH; skyC=null;
}

  KeyX:'F',ShiftLeft:'F',ShiftRight:'F',KeyJ:'F',Enter:'S',KeyP:'P',Escape:'P',KeyM:'M'};
function kd(k){if(!keys[k])pressed[k]=1;keys[k]=1;audioInit();}
addEventListener('keydown',e=>{const k=KM[e.code];if(!k)return;e.preventDefault();if(!e.repeat)kd(k);});
addEventListener('keyup',e=>{const k=KM[e.code];if(k)keys[k]=0;});

/* ---------------- 소리 (WebAudio로 직접 합성) ---------------- */
let AC=null, master, musG, sfxG, nbuf, muted=false;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=muted?0:0.55;master.connect(AC.destination);
  musG=AC.createGain();musG.gain.value=0.5;musG.connect(master);
  sfxG=AC.createGain();sfxG.gain.value=0.75;sfxG.connect(master);
  nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=nbuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
}
function osc(type,f0,f1,t,dur,vol,dest){
  if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain();o.type=type;
  o.frequency.setValueAtTime(f0,t);if(f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+dur+0.03);
}
function nz(t,dur,vol,dest,hp){
  if(!AC)return;const s=AC.createBufferSource(),gn=AC.createGain();s.buffer=nbuf;s.loop=true;
  gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0008,t+dur);
  if(hp){const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);f.connect(gn);}else s.connect(gn);
  gn.connect(dest);s.start(t,Math.random());s.stop(t+dur+0.03);
}
const tn=(type,f0,f1,dur,vol,when=0)=>{if(AC)osc(type,f0,f1,AC.currentTime+when,dur,vol,sfxG);};
const ns=(dur,vol,when=0,hp=0)=>{if(AC)nz(AC.currentTime+when,dur,vol,sfxG,hp);};
const seq=(fs,step,dur,vol,type='square')=>fs.forEach((f,i)=>f&&tn(type,f,f,dur,vol,i*step));
const SFX={
  jump(){tn('square',300,640,.15,.2);},
  coin(){tn('square',988,988,.07,.2);tn('square',1319,1319,.28,.2,.07);},
  stomp(){tn('square',420,110,.13,.28);ns(.07,.18);},
  bump(){tn('triangle',170,80,.11,.6);},
  brk(){ns(.22,.4);tn('square',220,60,.16,.2);},

/* --- 배경음악: 직접 작곡한 8마디 루프 × 4곡 --- */
const NOTE={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
function nf(s){let i=1,n=NOTE[s[0]];if(s[1]==='#'){n++;i++;}else if(s[1]==='b'){n--;i++;}
  return 440*Math.pow(2,(n-9+((+s.slice(i))-4)*12)/12);}
function mkSong(bpm,chords,lead){
  const tk=lead.trim().split(/\s+/), Ld=[], C=[];
  for(let i=0;i<tk.length;i++){if(tk[i]==='.'||tk[i]==='-')continue;let d=1;while(tk[i+d]==='-')d++;Ld[i]={f:nf(tk[i]),d};}
  chords.split(' ').forEach((c,b)=>{const p=c.split('/');
    for(let s=0;s<8;s++){const nm=p[p.length>1&&s>=4?1:0],mi=nm.endsWith('m');
      C[b*8+s]={r:nf((mi?nm.slice(0,-1):nm)+'2'),mi};}});
  return {bpm,Ld,C,n:tk.length};
}

let song=null, sStep=0, sTime=0, tempoMul=1;
function playSong(s,mul=1){tempoMul=mul;if(song===s)return;song=s;sStep=0;if(AC)sTime=AC.currentTime+0.06;}
function stopSong(){song=null;}
setInterval(()=>{
  if(!AC||!song||AC.state!=='running')return;
  if(sTime<AC.currentTime)sTime=AC.currentTime+0.03;
  while(sTime<AC.currentTime+0.18){
    const sd=30/(song.bpm*tempoMul), i=sStep, b=i%8, t=sTime, ch=song.C[i], l=song.Ld[i];
    if(l){osc('square',l.f,l.f,t,l.d*sd*0.95,.1,musG);osc('triangle',l.f*2,l.f*2,t,l.d*sd*0.5,.03,musG);}
    if(b%2===0)osc('triangle',ch.r*(b===4?2:1),ch.r*(b===4?2:1),t,sd*1.1,.34,musG);
    if(b===3||b===7)osc('triangle',ch.r*1.5,ch.r*1.5,t,sd*.9,.26,musG);
    const third=ch.r*4*Math.pow(2,(ch.mi?3:4)/12);
    osc('square',b%2?third:ch.r*6,b%2?third:ch.r*6,t,sd*.6,.022,musG);
    if(b===0||b===4||b===5&&i%16>8)osc('sine',130,40,t,.12,.5,musG);
    if(b===2||b===6)nz(t,.09,.12,musG,1500);
    nz(t,.03,b%2?.03:.05,musG,7000);
    sTime+=sd; sStep=(sStep+1)%song.n;
  }
},40);

/* ---------------- 스프라이트 (글자 한 칸 = 픽셀 한 칸) ---------------- */
function spr(rows,pal){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length)),c=mkc(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){const p=pal[rows[j][i]];if(p){x.fillStyle=p;x.fillRect(i,j,1,1);}}
  return c;
}

function ds(img,x,y,flip,w,h){
  x=Math.round(x);y=Math.round(y);w=w||img.width;h=h||img.height;
  if(flip){g.save();g.translate(x+w,y);g.scale(-1,1);g.drawImage(img,0,0,w,h);g.restore();}
  else g.drawImage(img,x,y,w,h);
}

const THEMES=[

function buildTiles(th){
  const T={},R=rng(11),mk=(fn,w=16,h=16)=>{const c=mkc(w,h);fn(c.getContext('2d'));return c;};
  T.in=mk(x=>{x.fillStyle=th.dirt;x.fillRect(0,0,16,16);x.fillStyle=th.dirt2;
    for(let i=0;i<7;i++)x.fillRect(R()*14|0,R()*14|0,2,2);
    x.fillStyle='rgba(255,255,255,.2)';for(let i=0;i<5;i++)x.fillRect(R()*15|0,R()*15|0,1,1);});
  T.top=mk(x=>{x.drawImage(T.in,0,0);x.fillStyle=th.top2;x.fillRect(0,0,16,6);
    for(let i=0;i<16;i+=4)x.fillRect(i,6,2,i%8?1:2);
    x.fillStyle=th.top;x.fillRect(0,0,16,4);for(let i=2;i<16;i+=4)x.fillRect(i,4,1,1);
    x.fillStyle='rgba(255,255,255,.5)';x.fillRect(0,0,16,1);});
  T.B=mk(x=>{x.fillStyle=th.brick;x.fillRect(0,0,16,16);x.fillStyle=th.brick2;
    x.fillRect(0,7,16,1);x.fillRect(0,15,16,1);x.fillRect(7,0,1,7);x.fillRect(15,0,1,7);x.fillRect(3,8,1,7);x.fillRect(11,8,1,7);
    x.fillStyle='rgba(255,255,255,.3)';x.fillRect(0,0,16,1);x.fillRect(0,8,16,1);});
  const GL=[".###.","#...#","....#","..##.","..#..",".....","..#.."];
  T.Q=[0,1,2].map(f=>mk(x=>{x.fillStyle='#a85a00';x.fillRect(0,0,16,16);
    x.fillStyle=['#ffbe1a','#ffd451','#fff0a0'][f];x.fillRect(1,1,14,14);
    x.fillStyle='#fff8c8';x.fillRect(1,1,14,1);x.fillRect(1,1,1,14);
    x.fillStyle='#d98a00';x.fillRect(1,14,14,1);x.fillRect(14,1,1,14);
    for(const [ox,oy,c] of [[6,5,'#8a4a00'],[5,4,'#fff']]){x.fillStyle=c;

    x.fillStyle='#8a4a00';[[2,2],[13,2],[2,13],[13,13]].forEach(p=>x.fillRect(p[0],p[1],1,1));}));
  T.U=mk(x=>{x.fillStyle='#4e3626';x.fillRect(0,0,16,16);x.fillStyle='#8f6e56';x.fillRect(1,1,14,14);

function mkLevel(def){
  const W=def.w,H=17,t=[];for(let y=0;y<H;y++)t.push(new Array(W).fill(' '));
  const Lv={w:W,h:H,t,ents:[],sx:3,th:def.th};
  def.build({
    g(x0,x1,top=14){for(let x=x0;x<=x1;x++)for(let y=top;y<H;y++)t[y][x]='#';},
    ceil(x0,x1,bot=1){for(let x=x0;x<=x1;x++)for(let y=0;y<=bot;y++)t[y][x]='#';},
    hole(x0,x1){for(let x=x0;x<=x1;x++)for(let y=2;y<H;y++)t[y][x]=' ';},
    lava(x0,x1){for(let x=x0;x<=x1;x++){t[15][x]='L';t[16][x]='L';}},
    r(x,y,s){for(let i=0;i<s.length;i++)if(s[i]!==' ')t[y][x+i]=s[i];},
    c(x,y,n=1){for(let i=0;i<n;i++)t[y][x+i]='o';},
    p(x,y,w){for(let i=0;i<w;i++)t[y][x+i]='=';},
    e(k,x,y=13){Lv.ents.push({k,x,y});}
  });
  return Lv;
}

function part(x,y,vx,vy,l,c,s=2,gr=.12){parts.push({x,y,vx,vy,l,ml:l,c,s,g:gr});}
function burst(x,y,n,cols,sp=2.5,l=30,s=2){for(let i=0;i<n;i++){const a=Math.random()*6.28,v=Math.random()*sp+.4;
  part(x,y,Math.cos(a)*v,Math.sin(a)*v-.6,l*(.6+Math.random()*.6)|0,cols[i%cols.length],s);}}
function dust(x,y,n=4){for(let i=0;i<n;i++)part(x,y,(Math.random()-.5)*1.6,-Math.random()*.7,14+Math.random()*8|0,'rgba(255,255,255,.8)',2,-.01);}

/* --- 충돌: 가로 → 세로 순서로 타일과 부딪히기 --- */
function moveBox(e){
  e.hitWall=0;e.onGround=false;e.head=null;
  e.x+=e.vx;
  let y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-.01)/TS);
  if(e.vx>0){const tx=Math.floor((e.x+e.w-.01)/TS);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=tx*TS-e.w;e.hitWall=1;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/TS);for(let ty=y0;ty<=y1;ty++)if(solidAt(tx,ty)){e.x=(tx+1)*TS;e.hitWall=-1;break;}}
  const pb=e.y+e.h;e.y+=e.vy;
  const x0=Math.floor(e.x/TS),x1=Math.floor((e.x+e.w-.01)/TS);
  if(e.vy>=0){const ty=Math.floor((e.y+e.h-.01)/TS);
    for(let tx=x0;tx<=x1;tx++){if(solidAt(tx,ty)||(tileAt(tx,ty)==='='&&pb<=ty*TS+.01)){e.y=ty*TS-e.h;e.vy=0;e.onGround=true;break;}}}
  else{const ty=Math.floor(e.y/TS);let hit=null;
    for(let tx=x0;tx<=x1;tx++)if(ty>=0&&solidAt(tx,ty)){(hit=hit||[]).push(tx);}
    if(hit){e.y=(ty+1)*TS;e.vy=0;e.head={ty,xs:hit};}}
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const isEnemy=e=>e.k==='slime'||e.k==='hog'||e.k==='bat';

function killEnemy(e,how,pts){
  e.dead=how;if(how==='flat')e.dt=24;else{e.vy=-4;e.vx=(hero.face||1)*1.3;}
  addScore(pts||200,e.x,e.y-6);burst(e.x+6,e.y+4,8,['#fff','#ffe14d','#ff9d3b'],2,22);
}
function bumpTile(tx,ty){
  const c=L.t[ty][tx];
  const above=()=>{
    for(const e of ents)if(isEnemy(e)&&!e.dead&&e.x+e.w>tx*TS&&e.x<tx*TS+TS&&Math.abs(e.y+e.h-ty*TS)<3){killEnemy(e,'flip');SFX.kick();}
    if(tileAt(tx,ty-1)==='o'){L.t[ty-1][tx]=' ';gainCoin();}
  };
  if(c==='?'||c==='P'||c==='S'){
    L.t[ty][tx]='U';bumps.push({tx,ty,t:0});SFX.bump();above();
    if(c==='?'){gainCoin();parts.push({x:tx*TS+3,y:ty*TS-10,vx:0,vy:-3.6,l:26,ml:26,c:'',s:0,g:.22,coin:1});}
    else{ents.push({k:c==='P'?'fruit':'star',w:12,h:12,x:tx*TS+2,y:ty*TS-2,vx:0,vy:0,rise:14,dir:1,active:true});SFX.appear();}
  }else if(c==='B'){
    above();
    if(hero.pow){L.t[ty][tx]=' ';SFX.brk();addScore(50);shake=Math.max(shake,2);
      for(let i=0;i<4;i++)part(tx*TS+4+(i%2)*8,ty*TS+4+(i>>1)*8,(i%2?1:-1)*(1+Math.random()),-3-Math.random()*2,50,i%2?TH.brick:TH.brick2,4,.3);}
    else{bumps.push({tx,ty,t:0});SFX.bump();}
  }else SFX.bump();
}
function hurtHero(){
  const h=hero;if(h.dead||h.inv>0||h.star>0||god||state!=='play')return;
  if(h.pow){h.pow=false;h.inv=110;SFX.hurt();shake=6;burst(h.x+5,h.y+7,12,['#ff3b4e','#ffb020'],2.5,26);}
  else killHero();
}
function killHero(){
  const h=hero;if(h.dead||state!=='play')return;if(god){h.vy=-8;return;}
  h.dead=true;h.deadT=0;h.vy=-6.5;h.vx=0;h.pow=false;h.star=0;stopSong();SFX.die();shake=8;
}
function updHero(){
  const h=hero;h.anim++;
  if(h.dead){h.deadT++;if(h.deadT>18){h.vy+=.4;h.y+=h.vy;}
    if(h.deadT>120){lives--;if(lives<=0){state='over';stateT=0;if(score>save.best){save.best=score;persist();}}else startLevel(lvlIdx,true);}
    return;}
  const dir=(keys.R?1:0)-(keys.L?1:0);
  if(dir){h.vx+=dir*(h.onGround?.3:.2);h.face=dir;}else h.vx*=h.onGround?.76:.96;
  h.vx=clamp(h.vx,-2.25,2.25);if(Math.abs(h.vx)<.05)h.vx=0;
  if(pressed.J)h.jbuf=7;else if(h.jbuf>0)h.jbuf--;
  if(h.onGround)h.coy=6;else if(h.coy>0)h.coy--;
  if(h.jbuf>0&&h.coy>0){h.vy=-6.2;h.jbuf=0;h.coy=0;h.jumping=true;SFX.jump();dust(h.x+5,h.y+14,3);}
  if(h.jumping&&!keys.J&&h.vy<-2.2)h.vy=-2.2;
  if(h.vy>=0)h.jumping=false;
  h.vy=Math.min(h.vy+(h.vy<0?.3:.55),6.5);
  const wasG=h.onGround,pvy=h.vy,pb=h.y+h.h;
  moveBox(h);h.pb=pb;
  if(h.hitWall)h.vx=0;
  if(h.head){const cx=Math.floor((h.x+h.w/2)/TS);bumpTile(h.head.xs.includes(cx)?cx:h.head.xs[0],h.head.ty);}
  if(h.onGround){if(!wasG&&pvy>3)dust(h.x+5,h.y+14,4);h.combo=0;
    if(Math.abs(h.vx)>1.5&&h.anim%9===0)dust(h.x+5-h.face*4,h.y+14,1);}
  // 타일과의 상호작용: 코인, 가시, 용암, 스프링
  const x0=Math.floor(h.x/TS),x1=Math.floor((h.x+h.w-.01)/TS),y0=Math.floor(h.y/TS),y1=Math.floor((h.y+h.h-.01)/TS);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const c=tileAt(tx,ty);
    if(c==='o'){L.t[ty][tx]=' ';gainCoin();burst(tx*TS+8,ty*TS+8,5,['#ffe14d','#fff'],1.4,16,1);}
    else if(c==='^'){if(h.y+h.h>ty*TS+7&&h.x+h.w>tx*TS+2&&h.x<tx*TS+14)hurtHero();}
    else if(c==='L'){if(h.y+h.h>ty*TS+5){burst(h.x+5,h.y+10,16,['#ffb020','#ff5a1a','#ffe14d'],3,30);killHero();}}
    else if(c==='J'&&pvy>0&&h.y+h.h>ty*TS+6){h.vy=-9.6;h.onGround=false;h.coy=0;h.jumping=false;
      bumps.push({tx,ty,t:0,spring:1});SFX.spring();burst(tx*TS+8,ty*TS+8,6,['#ff4d6a','#fff'],2,18);}
  }
  if(h.y>L.h*TS+24)killHero();
  if(pressed.F&&h.pow&&ents.filter(e=>e.k==='fire').length<2){
    ents.push({k:'fire',w:6,h:6,x:h.x+(h.face>0?8:-4),y:h.y+4,vx:h.face*4.2,vy:1,life:110,active:true});SFX.fire();}
  if(h.inv>0)h.inv--;
  if(h.star>0){h.star--;if(tick%3===0)part(h.x+Math.random()*10,h.y+Math.random()*14,0,-.4,18,['#ff5fd0','#5fe0ff','#ffe14d','#7dff8a'][tick/3&3],2,0);
    if(h.star===0)tempoMul=boss&&boss.awake?1.15:1;}
  // 적·아이템과 부딪히기
  for(const e of ents){
    if(e.gone||e.dead||!e.active||!overlap(h,e))continue;
    if(isEnemy(e)){
      if(h.star>0){killEnemy(e,'flip');SFX.kick();}
      else if(pvy>0&&pb<=e.y+e.h*.65+2&&e.k!=='hog'){
        killEnemy(e,e.k==='bat'?'flip':'flat',Math.min(100<<h.combo,1600));h.combo++;
        h.vy=keys.J?-6.4:-4;h.jumping=keys.J;SFX.stomp();if(h.combo>=5){lives++;SFX.oneup();}
      }else hurtHero();
    }else if(e.k==='boss'){
      if(e.inv>0||e.hp<=0)continue;
      if(pvy>0&&pb<=e.y+12){hitBoss(e);h.vy=-6.6;h.jumping=false;}else hurtHero();
    }else if(e.k==='fruit'&&!e.rise){e.gone=true;SFX.power();addScore(1000,e.x,e.y);h.pow=true;burst(h.x+5,h.y+7,14,['#ff7a1a','#ffe14d','#fff'],2.6,28);}
    else if(e.k==='star'&&!e.rise){e.gone=true;SFX.star();addScore(1000,e.x,e.y);h.star=540;tempoMul=1.35;}
    else if(e.k==='check'&&!e.on){e.on=true;checkpoint=e.tx;SFX.check();burst(e.x+4,e.y+6,16,['#7dff8a','#fff','#ffe14d'],2.6,34);
      pops.push({x:e.x-10,y:e.y-8,s:'체크포인트!',t:0,c:'#7dff8a'});}
    else if(e.k==='goal'){state='clear';stateT=0;stopSong();SFX.clear();h.vx=0;addScore(2000+lives*200);
      if(lvlIdx+1<LEVELS.length&&save.unlocked<lvlIdx+1){save.unlocked=lvlIdx+1;}
      if(score>save.best)save.best=score;persist();}
  }
}
function hitBoss(b){
  b.hp--;b.inv=75;SFX.bosshit();shake=10;addScore(1000,b.x+12,b.y-8);
  burst(b.x+20,b.y+10,22,['#a45cff','#fff','#ff5fd0'],3.5,34,3);
  if(b.hp<=0){b.gone=true;stopSong();SFX.clear();addScore(5000,b.x+10,b.y-20);shake=16;
    for(let i=0;i<5;i++)burst(b.x+Math.random()*40,b.y+Math.random()*26,18,['#a45cff','#ffe14d','#fff','#ff5fd0'],4,50,3);
    const gx=160*TS;ents.push({k:'goal',w:14,h:30,x:gx+1,y:14*TS-30,vx:0,vy:0,active:true,born:tick});
    pops.push({x:gx-20,y:12*TS,s:'별문이 열렸다!',t:-40,c:'#ffe14d'});}
}
function updEnts(){
  for(const e of ents){
    if(e.gone)continue;
    if(!e.active){if(e.x<cam.x+VW+40)e.active=true;else continue;}
    if(isEnemy(e)){
      if(e.dead){if(e.dead==='flat'){if(--e.dt<=0)e.gone=true;}else{e.vy+=.4;e.y+=e.vy;e.x+=e.vx;if(e.y>L.h*TS+40)e.gone=true;}continue;}
      if(e.k==='bat'){e.t++;const nx=e.ox+Math.sin(e.t*.022)*38;e.dir=nx>e.x?1:-1;e.x=nx;e.y=e.oy+Math.sin(e.t*.07)*13;}
      else{e.vx=e.dir*e.sp;e.vy=Math.min(e.vy+.45,6);moveBox(e);
        if(e.hitWall)e.dir=-e.dir;
        else if(e.onGround){const ax=e.dir>0?e.x+e.w+1:e.x-1,tx=Math.floor(ax/TS),ty=Math.floor((e.y+e.h+2)/TS);
          if(!solidAt(tx,ty)&&tileAt(tx,ty)!=='=')e.dir=-e.dir;}
        if(e.y>L.h*TS+30)e.gone=true;}
      for(const f of ents)if(f.k==='fire'&&!f.gone&&overlap(e,f)){f.gone=true;killEnemy(e,'flip');SFX.kick();break;}
    }else if(e.k==='fruit'||e.k==='star'){
      if(e.rise>0){e.rise--;e.y-=1;continue;}
      e.vx=e.dir*(e.k==='star'?1.1:.8);e.vy=Math.min(e.vy+.4,6);moveBox(e);
      if(e.hitWall)e.dir=-e.dir;if(e.onGround&&e.k==='star')e.vy=-4.6;if(e.y>L.h*TS+30)e.gone=true;
    }else if(e.k==='fire'){
      e.vy=Math.min(e.vy+.35,5);moveBox(e);if(e.onGround)e.vy=-3;
      if(tick%2===0)part(e.x+3,e.y+3,0,0,10,tick%4?'#ffb020':'#ff5a1a',2,0);
      if(e.hitWall||--e.life<=0||e.y>L.h*TS){e.gone=true;burst(e.x+3,e.y+3,5,['#ffb020','#fff'],1.5,12);}
      if(boss&&!boss.gone&&boss.awake&&boss.inv<=0&&overlap(e,boss)){e.gone=true;hitBoss(boss);}
    }else if(e.k==='boss'){
      const b=e;
      if(!b.awake){if(hero.x>144*TS&&hero.onGround){b.awake=true;banner=150;bannerTxt='보스  슬라임 대왕!';playSong(SONGS[3],1.15);SFX.thud();shake=8;}continue;}
      if(b.inv>0)b.inv--;
      const wasG=b.onGround;b.vy=Math.min(b.vy+.42,7);
      if(wasG){b.vx*=.7;if(--b.wait<=0){const rage=3-b.hp;b.vy=-(5.4+Math.random()*1.8);
        b.vx=Math.sign(hero.x-b.x-15)*(1.1+rage*.45+Math.random()*.5);b.wait=46-rage*11;tn('square',140,320,.18,.18);}}
      moveBox(b);if(b.hitWall)b.vx=-b.vx*.5;
      if(!wasG&&b.onGround){shake=Math.max(shake,5);SFX.thud();dust(b.x+4,b.y+27,5);dust(b.x+36,b.y+27,5);}
    }
  }
  ents=ents.filter(e=>!e.gone);
}
function update(){
  tick++;
  if(pressed.M){muted=!muted;if(master)master.gain.value=muted?0:.55;}
  if(state==='title'){
    stateT++;cam.x=(cam.x+.6)%((L.w*TS)-VW);
    if(save.unlocked>0){if(pressed.L&&startLvl>0){startLvl--;SFX.sel();}if(pressed.R&&startLvl<save.unlocked){startLvl++;SFX.sel();}}
    if((pressed.S||pressed.J)&&stateT>20){lives=5;coins=0;score=0;SFX.power();startLevel(startLvl,false);}
    if(AC&&!song)playSong(SONGS[0]);
  }else if(state==='play'){
    if(pressed.P&&!hero.dead){paused=!paused;SFX.sel();if(paused)stopSong();else playSong(SONGS[lvlIdx],boss&&boss.awake?1.15:1);}
    if(!paused){
      stateT++;updHero();if(state==='play'||state==='clear')updEnts();
      if(state==='play'&&!song&&!hero.dead&&AC&&!(boss===null&&lvlIdx===3&&ents.some(e=>e.k==='goal')))playSong(SONGS[lvlIdx],boss&&boss.awake?1.15:1);
    }
  }else if(state==='clear'){
    stateT++;const h=hero,gl=ents.find(e=>e.k==='goal');
    if(gl&&stateT<50){h.x+=(gl.x+2-h.x)*.12;h.y+=(gl.y+10-h.y)*.12;}
    if(stateT===50&&gl)burst(gl.x+7,gl.y+14,30,['#fff','#ffe14d','#5fe0ff','#ff5fd0'],3.5,40,2);
    if(stateT>40&&stateT%14===0){const fx=cam.x+40+Math.random()*(VW-80),fy=40+Math.random()*90;
      burst(fx,fy,22,[['#ff5fd0','#fff'],['#5fe0ff','#fff'],['#ffe14d','#fff'],['#7dff8a','#fff']][stateT/14&3],2.6,44,2);
      if(stateT%28===0)ns(.25,.12,0,2500);}
    if(stateT>230||(stateT>90&&pressed.S)){
      if(lvlIdx+1<LEVELS.length)startLevel(lvlIdx+1,false);else{state='win';stateT=0;playSong(SONGS[0],.9);}}
  }else if(state==='over'){
    stateT++;if(stateT>40&&(pressed.S||pressed.J)){lives=5;coins=0;score=0;startLevel(lvlIdx,false);}
  }else if(state==='win'){
    stateT++;cam.x=(cam.x+.8)%((L.w*TS)-VW);
    if(stateT%16===0){const fx=cam.x+30+Math.random()*(VW-60),fy=30+Math.random()*110;
      burst(fx,fy,24,[['#ff5fd0','#fff'],['#5fe0ff','#fff'],['#ffe14d','#fff'],['#7dff8a','#fff']][stateT/16&3],2.8,48,2);}
    if(stateT>120&&(pressed.S||pressed.J))toTitle();
  }
  if(!paused){
    for(const p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.l--;}
    parts=parts.filter(p=>p.l>0);
    for(const p of pops)p.t++;pops=pops.filter(p=>p.t<60);
    for(const b of bumps)b.t++;bumps=bumps.filter(b=>b.t<(b.spring?14:9));
    if(shake>0)shake*=.86;if(shake<.3)shake=0;if(banner>0)banner--;
    if(state==='play'||state==='clear'){
      const lock=boss&&boss.awake&&!boss.gone;
      let tx=hero.x+hero.w/2-VW/2+hero.face*26;
      if(lock)tx=clamp(tx,139*TS,177*TS-VW<139*TS?139*TS:177*TS-VW);
      if(!hero.dead)cam.x+=(tx-cam.x)*.09;cam.x=clamp(cam.x,0,L.w*TS-VW);
    }
  }
  for(const k in pressed)delete pressed[k];
}
function toTitle(){state='title';stateT=0;L=mkLevel(LEVELS[0]);setTheme(0);ents=[];parts=[];pops=[];bumps=[];boss=null;hero=null;cam.x=0;
  startLvl=Math.min(startLvl,save.unlocked);if(AC)playSong(SONGS[0]);else song=null;}

/* ---------------- 그리기 ---------------- */
function drawCoin(x,y,t){
  const w=[8,6,2,6][t>>3&3],ox=(8-w)/2|0;
  g.fillStyle='#b86a00';g.fillRect(x+ox,y,w,10);g.fillStyle='#ffd21a';g.fillRect(x+ox+(w>2?1:0),y+1,Math.max(1,w-2),8);
  if(w>4){g.fillStyle='#fff6b0';g.fillRect(x+ox+2,y+2,1,5);g.fillStyle='#e09a00';g.fillRect(x+ox+w-3,y+3,1,4);}
}
function drawWorld(){
  const sx=shake?(Math.random()-.5)*shake:0, sy=shake?(Math.random()-.5)*shake:0;
  const cx=Math.round(cam.x+sx), cy=Math.round(sy);
  if(!skyC)skyC=buildSky(L.th);
  g.drawImage(skyC,0,0);
  if(L.th===3){for(let i=0;i<14;i++){const h=hash(i);if(((tick>>3)+h)%7===0){g.fillStyle='#fff';g.fillRect(h%VW,(h>>9)%150,2,2);}}}
  for(const l of BGS[L.th]){let ox=-Math.floor(cam.x*l.f)%512;if(ox>0)ox-=512;for(;ox<VW;ox+=512)g.drawImage(l.c,ox,0);}
  // 타일
  const tx0=Math.max(0,Math.floor(cx/TS)),tx1=Math.min(L.w-1,Math.floor((cx+VW)/TS));
  const qf=[0,0,0,0,1,2,1,0][tick>>3&7];
  for(let ty=0;ty<L.h;ty++){const row=L.t[ty];for(let tx=tx0;tx<=tx1;tx++){
    const c=row[tx];if(c===' ')continue;let x=tx*TS-cx,y=ty*TS-cy;
    if(c==='#'){const up=ty>0&&!SOLID[L.t[ty-1][tx]];g.drawImage(up?TL.top:TL.in,x,y);
      if(!up&&ty<L.h-1&&!SOLID[L.t[ty+1][tx]]&&L.t[ty+1][tx]!=='L'){g.fillStyle='rgba(0,0,0,.28)';g.fillRect(x,y+13,16,3);}
      if(up&&L.t[ty-1][tx]===' '){const hh=hash(tx*31+ty);if(hh%4===0)deco(x,y,hh);}
      continue;}
    if(c==='o'){drawCoin(x+4,y+3+Math.sin((tick+tx*9)*.08)*1.5|0,tick+tx*5);continue;}
    if(c==='L'){const top=L.t[ty-1][tx]!=='L';g.fillStyle='#ff5a1a';g.fillRect(x,y,16,16);
      if(top){const w=Math.sin((tick+tx*14)*.07)*2|0;g.fillStyle='#ffb020';g.fillRect(x,y+2+w,16,4);g.fillStyle='#fff0a0';g.fillRect(x,y+2+w,16,1);
        g.fillStyle='rgba(255,140,40,.25)';g.fillRect(x,y-10,16,12);
        if((tick+tx*7)%50===0)part(tx*TS+Math.random()*16,ty*TS+2,0,-1.2,26,'#ffe14d',2,.03);}
      else{g.fillStyle='#d9361e';g.fillRect(x+(hash(tx+ty)%10),y+(hash(tx*3+ty)%10),4,2);}continue;}
    for(const b of bumps)if(b.tx===tx&&b.ty===ty&&!b.spring)y-=Math.sin(b.t/9*Math.PI)*5|0;
    if(c==='B')g.drawImage(TL.B,x,y);else if(c==='?'||c==='P'||c==='S')g.drawImage(TL.Q[qf],x,y);
    else if(c==='U')g.drawImage(TL.U,x,y);else if(c==='X')g.drawImage(TL.X,x,y);else if(c==='=')g.drawImage(TL.P,x,y);
    else if(c==='^')g.drawImage(TL.S,x,y);
    else if(c==='J')g.drawImage(TL.J[bumps.some(b=>b.spring&&b.tx===tx&&b.t<6)?1:0],x,y);
  }}
  // 개체
  for(const e of ents){
    const x=e.x-cx,y=e.y-cy;if(x<-60||x>VW+60)continue;
    if(e.k==='slime'||e.k==='hog'){const im=SPR[e.k];
      if(e.dead==='flat')ds(im,x-2,y+6,false,16,4);
      else if(e.dead){g.save();g.translate(Math.round(x-2),Math.round(y+10));g.scale(1,-1);g.drawImage(im,0,0);g.restore();}
      else{const s=1+Math.sin(tick*.2+e.x)*.1,hh=10*s|0;ds(im,x-2,y-1+(10-hh),e.dir>0,16,hh);}}
    else if(e.k==='bat'){const im=SPR.bat[e.dead?1:(tick>>3)&1];
      if(e.dead){g.save();g.translate(Math.round(x-2),Math.round(y+8));g.scale(1,-1);g.drawImage(im,0,0);g.restore();}else ds(im,x-2,y-1,e.dir>0);}
    else if(e.k==='fruit'||e.k==='star'){if(e.k==='star'&&tick%4<2){g.fillStyle='rgba(255,255,200,.5)';g.fillRect(x-2,y-2,16,16);}ds(SPR[e.k],x,y);}
    else if(e.k==='fire'){g.fillStyle='#ff5a1a';g.fillRect(x|0,y|0,6,6);g.fillStyle='#ffe14d';g.fillRect((x|0)+1,(y|0)+1,4,4);g.fillStyle='#fff';g.fillRect((x|0)+2,(y|0)+2,2,2);}
    else if(e.k==='check'){g.fillStyle='#e8ecff';g.fillRect(x+3|0,y|0,2,32);g.fillStyle='#8d93a8';g.fillRect(x+1|0,y+30|0,6,2);
      const cols=e.on?['#ff5fd0','#ffe14d','#7dff8a']:['#9aa0b8','#b9bed2','#9aa0b8'];
      for(let i=0;i<12;i++){const wv=Math.sin(tick*.15+i*.5)*1.5|0;g.fillStyle=cols[i>>2];g.fillRect((x+5|0)+i,(y+2|0)+wv,1,9-(i>>1));}}
    else if(e.k==='goal'){const mx=x+7,my=y+14;
      for(let r=5;r>=0;r--){g.fillStyle=['#fff','#fff7b0','#ffe14d','#ff9df0','#8f7bff','#35a7ff'][r];g.globalAlpha=r===5?.35:.9;
        g.beginPath();g.ellipse(mx,my,3+r*2.2+Math.sin(tick*.1+r)*1,6+r*3.2+Math.cos(tick*.1+r)*1,0,0,7);g.fill();}
      g.globalAlpha=1;
      for(let i=0;i<4;i++){const a=tick*.06+i*1.57;g.fillStyle='#fff';g.fillRect(mx+Math.cos(a)*15|0,my+Math.sin(a)*22|0,2,2);}
      if(tick%5===0)part(e.x+Math.random()*14,e.y+30,(Math.random()-.5)*.4,-1-Math.random(),34,['#ffe14d','#ff9df0','#5fe0ff'][tick/5%3|0],2,-.01);}
    else if(e.k==='boss'){
      if(e.inv>0&&tick%6<3)continue;
      const st=clamp(1-e.vy*.03,.8,1.2),w=48/st|0,hh=30*st|0,bx=x+20-w/2,by=y+27-hh;
      ds(SPR.boss,bx,by,hero&&hero.x>e.x+15,w,hh);
      g.fillStyle='#ffd21a';g.fillRect(bx+w/2-9|0,by-6|0,18,7);
      for(let i=0;i<3;i++){g.fillRect((bx+w/2-9|0)+i*7,by-10|0,4,5);}
      g.fillStyle='#ff3b4e';g.fillRect(bx+w/2-1|0,by-3|0,3,3);g.fillStyle='#fff8c8';g.fillRect(bx+w/2-9|0,by-6|0,18,1);}
  }
  // 코코
  if(hero&&!(state==='clear'&&stateT>=50)){
    const h=hero,x=h.x-cx-3,y=h.y-cy-2;
    if(!(h.inv>0&&tick%6<3)){
      const set=h.star>0?HERO.s[tick>>2&3]:h.pow?HERO.p:HERO.n;
      const f=h.dead||!h.onGround?'j':Math.abs(h.vx)>.3?((h.anim>>2)&1?'a':'b'):'idle';
      if(h.dead){g.save();g.translate(Math.round(x+8),Math.round(y+8));g.rotate(h.deadT*.25);g.drawImage(set.j,-8,-8);g.restore();}
      else ds(set[f],x,y+(f==='idle'&&(tick>>4&1)?1:0),h.face<0);
    }
  }
  // 입자
  for(const p of parts){const x=p.x-cx,y=p.y-cy;
    if(p.coin){drawCoin(x|0,y|0,tick*3);continue;}
    g.globalAlpha=Math.min(1,p.l/p.ml*1.6);g.fillStyle=p.c;g.fillRect(x|0,y|0,p.s,p.s);}
  g.globalAlpha=1;
  // 분위기 입자 (꽃가루·모래·반딧불·눈)
  const a=TH.amb;
  for(const p of amb){
    if(a==='snow'){p.y+=p.s*.6;p.x+=Math.sin(tick*.02+p.p)*.3;}
    else if(a==='sand'){p.x+=p.s*1.6;p.y+=Math.sin(tick*.03+p.p)*.15;}
    else if(a==='mote'){p.y-=p.s*.15;p.x+=Math.sin(tick*.015+p.p)*.25;}
    else{p.x+=p.s*.25;p.y+=Math.sin(tick*.03+p.p)*.3;}
    if(p.y>VH)p.y=0;if(p.y<0)p.y=VH;
    const x=((p.x-cam.x*.9)%600+600)%600;if(x>VW)continue;
    if(a==='mote'){g.globalAlpha=.35+Math.sin(tick*.06+p.p)*.35;g.fillStyle=p.p>3.5?'#7dfff0':'#ff9df0';g.fillRect(x|0,p.y|0,2,2);}
    else if(a==='snow'){g.globalAlpha=.9;g.fillStyle='#fff';g.fillRect(x|0,p.y|0,p.s>.8?2:1,p.s>.8?2:1);}
    else if(a==='sand'){g.globalAlpha=.5;g.fillStyle='#ffe9b8';g.fillRect(x|0,p.y|0,3,1);}
    else{g.globalAlpha=.75;g.fillStyle=p.p>3.5?'#fff':'#fff6a0';g.fillRect(x|0,p.y|0,1,1);}
  }
  g.globalAlpha=1;
  if(L.th===2){const q=g.createRadialGradient(VW/2,VH/2,VH*.35,VW/2,VH/2,VH*.95);q.addColorStop(0,'rgba(0,0,20,0)');q.addColorStop(1,'rgba(0,0,20,.55)');g.fillStyle=q;g.fillRect(0,0,VW,VH);}
}
function deco(x,y,h){
  const t=L.th,v=(h>>4)%3;
  if(t===0){if(v===0){g.fillStyle='#2f9e3e';g.fillRect(x+7,y-5,1,5);g.fillStyle=['#ff5fa2','#ffe14d','#fff'][(h>>8)%3];
      g.fillRect(x+6,y-7,3,3);g.fillStyle='#ff9d3b';g.fillRect(x+7,y-6,1,1);}
    else{g.fillStyle='#3fae38';g.fillRect(x+3,y-3,1,3);g.fillRect(x+5,y-4,1,4);g.fillRect(x+7,y-2,1,2);g.fillRect(x+11,y-3,1,3);}}
  else if(t===1){if(v===0){g.fillStyle='#2f8a4a';g.fillRect(x+6,y-8,3,8);g.fillRect(x+3,y-5,3,2);g.fillRect(x+3,y-7,1,2);g.fillRect(x+9,y-4,3,2);g.fillRect(x+11,y-6,1,2);}
    else{g.fillStyle='#a5622f';g.fillRect(x+4,y-2,5,2);g.fillRect(x+10,y-1,2,1);}}
  else if(t===2){const c=['#52f0ff','#ff6adf','#7dffb0'][(h>>8)%3];g.fillStyle=c;
    g.fillRect(x+6,y-8,3,8);g.fillRect(x+4,y-4,2,4);g.fillRect(x+9,y-5,2,5);g.fillStyle='#fff';g.fillRect(x+7,y-7,1,4);}
  else{if(v===0){g.fillStyle='#fff';g.fillRect(x+3,y-2,9,2);g.fillRect(x+5,y-4,5,2);}
    else{g.fillStyle='#17295a';g.fillRect(x+7,y-2,1,2);g.fillStyle='#2d7a5a';g.fillRect(x+5,y-5,5,3);g.fillRect(x+6,y-8,3,3);g.fillStyle='#fff';g.fillRect(x+6,y-8,3,1);}}
}
function txt(s,x,y,size,col='#fff',align='left',stroke='#1a1030'){
  ctx.font=`900 ${Math.max(6,size*scale)|0}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';
  const X=offX+x*scale,Y=offY+y*scale;ctx.lineJoin='round';ctx.lineWidth=Math.max(2,size*scale*.24);
  ctx.strokeStyle=stroke;ctx.strokeText(s,X,Y);ctx.fillStyle=col;ctx.fillText(s,X,Y);
}
function panel(a){ctx.fillStyle=`rgba(8,6,30,${a})`;ctx.fillRect(offX,offY,VW*scale,VH*scale);}
function icon(img,x,y,s){ctx.drawImage(img,offX+x*scale,offY+y*scale,img.width*s*scale,img.height*s*scale);}
let coinIcon=null;
function render(){
  ctx.fillStyle='#070a1c';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled=false;
  drawWorld();
  ctx.drawImage(lo,offX,offY,VW*scale,VH*scale);
  ctx.save();ctx.beginPath();ctx.rect(offX,offY,VW*scale,VH*scale);ctx.clip();
  const bob=Math.sin(tick*.08)*3;
  if(state==='title'){
    panel(.25);
    txt('코코의',VW/2,56+bob,20,'#ffffff','center','#16306e');
    const gr=ctx.createLinearGradient(0,offY+70*scale,0,offY+120*scale);gr.addColorStop(0,'#fff6a0');gr.addColorStop(.5,'#ffc21a');gr.addColorStop(1,'#ff6a3d');
    txt('별빛 대모험',VW/2,96+bob,44,gr,'center','#3a1466');
    icon(HERO.n[(tick>>3)&1?'a':'b'],VW/2-24,128,3);
    for(let i=0;i<6;i++){const a=tick*.03+i*1.05;icon(SPR.star,VW/2-6+Math.cos(a)*150,100+Math.sin(a*1.3)*46,1);}
    if(tick%50<34)txt(isTouch?'화면을 터치하면 시작!':'ENTER 또는 SPACE 로 시작!',VW/2,196,15,'#fff','center');
    if(save.unlocked>0)txt('◀  WORLD '+(startLvl+1)+' · '+THEMES[LEVELS[startLvl].th].name+'  ▶',VW/2,218,11,'#7dfff0','center');
    txt(isTouch?'◀ ▶ 이동 · 점프 · 불꽃':'← → 이동 · SPACE 점프 · X 불꽃 · P 일시정지 · M 소리',VW/2,240,9,'#e8ecff','center');
    if(save.best)txt('최고 점수 '+save.best,VW/2,256,9,'#ffe14d','center');
  }else{
    // HUD
    icon(HERO.n.idle,8,5,1);txt('×'+lives,27,14,12);
    if(!coinIcon){coinIcon=mkc(8,10);const sv=g;}
    ctx.fillStyle='#b86a00';ctx.fillRect(offX+64*scale,offY+8*scale,8*scale,11*scale);
    ctx.fillStyle='#ffd21a';ctx.fillRect(offX+65*scale,offY+9*scale,6*scale,9*scale);
    txt('×'+String(coins).padStart(2,'0'),76,14,12,'#ffe14d');
    txt(String(score).padStart(6,'0'),VW-(isTouch?52:8),14,12,'#fff','right');
    txt('WORLD '+(lvlIdx+1),VW/2,14,10,'#cfe6ff','center');
    if(hero&&hero.pow)txt('🔥',112,14,11);
    if(hero&&hero.star>0)txt('★ '+Math.ceil(hero.star/60),VW/2,30,11,['#ff5fd0','#5fe0ff','#ffe14d','#7dff8a'][tick>>2&3],'center');
    if(muted)txt('소리 꺼짐',VW-8,30,8,'#ff9aa8','right');
    if(boss&&boss.awake&&!boss.gone){txt('슬라임 대왕',VW/2,VH-26,9,'#e0c0ff','center');
      for(let i=0;i<3;i++){ctx.fillStyle=i<boss.hp?'#ff3b6e':'#3a2a55';ctx.fillRect(offX+(VW/2-34+i*24)*scale,offY+(VH-18)*scale,20*scale,6*scale);}}
    const cx=cam.x;
    for(const p of pops)if(p.t>=0)txt(p.s,p.x-cx+6,p.y-p.t*.5,8,p.c||'#fff','center');
    if(banner>0&&state==='play'){const a=Math.min(1,banner/30,(170-banner)/14+.01);ctx.globalAlpha=clamp(a,0,1);
      ctx.fillStyle='rgba(8,6,30,.55)';ctx.fillRect(offX,offY+78*scale,VW*scale,40*scale);
      txt(bannerTxt,VW/2,98,20,'#ffe14d','center');ctx.globalAlpha=1;}
    if(paused){panel(.6);txt('일시정지',VW/2,120,28,'#fff','center');txt(isTouch?'Ⅱ 버튼으로 계속':'P 를 누르면 계속',VW/2,152,11,'#cfe6ff','center');}
    if(state==='clear'&&stateT>55){txt('WORLD CLEAR!',VW/2,100+bob,34,'#ffe14d','center','#3a1466');
      txt('보너스 +'+(2000+lives*200),VW/2,134,13,'#fff','center');}
    if(state==='over'){panel(Math.min(.7,stateT/60));txt('GAME OVER',VW/2,110,36,'#ff5a6e','center');
      txt('점수 '+score,VW/2,146,13,'#fff','center');
      if(stateT>40&&tick%50<34)txt(isTouch?'터치해서 이 월드부터 다시!':'ENTER 로 이 월드부터 다시!',VW/2,172,12,'#ffe14d','center');}
    if(state==='win'){panel(.35);txt('축하합니다!',VW/2,70+bob,36,'#ffe14d','center','#3a1466');
      txt('코코가 별빛을 모두 되찾았어요',VW/2,108,15,'#fff','center');
      icon(HERO.p[(tick>>3)&1?'a':'b'],VW/2-24,122,3);
      txt('최종 점수 '+score,VW/2,190,16,'#7dfff0','center');txt('최고 점수 '+save.best,VW/2,210,11,'#ffe14d','center');
      if(stateT>120&&tick%50<34)txt(isTouch?'터치하면 처음으로':'ENTER 로 처음으로',VW/2,236,11,'#fff','center');}
  }
  ctx.restore();
}

/* ---------------- 메인 루프 (1초에 60번 고정) ---------------- */
let last=0, acc=0;
function frame(t){
  requestAnimationFrame(frame);
  const dt=Math.min(100,t-last);last=t;acc+=dt;
  let n=0;while(acc>=1000/60&&n<5){update();acc-=1000/60;n++;}
  if(n===5)acc=0;
  render();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){if(state==='play'&&hero&&!hero.dead&&!paused){paused=true;stopSong();}if(AC)AC.suspend();}
  else if(AC)AC.resume();
});
toTitle();
window.__g={get s(){return{state,lvlIdx,hero,L,ents,cam,score,lives,coins,boss,VW};},keys,pressed,update,render,
  start:i=>{lives=5;startLevel(i,false);},god:v=>{god=v;}};
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
